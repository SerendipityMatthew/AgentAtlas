<style>
  :root {
    --bg: #F0ECE0;
    --bg-panel: #FAF7EC;
    --ink: #2C2820;
    --ink-soft: #6B6454;
    --green: #3D5D3C;
    --green-bright: #D5EC9B;
    --green-soft: #E4ECD6;
    --line: #DDD6C2;
    --grid: #E5DFC8;
    --yellow: #F5E9A8;
    --yellow-soft: #FBF1C0;
    --pink: #F2D3CB;
    --pink-soft: #F9E3DC;
    --blue: #CDD9E0;
    --blue-soft: #E3EBF0;
    --purple: #D6CDE0;
    --code-bg: #262319;
  }
  :root[data-theme="dark"] {
    --bg: #1A1812;
    --bg-panel: #24221A;
    --ink: #E8E1CF;
    --ink-soft: #A8A190;
    --green: #A6C19E;
    --green-bright: #3F5A34;
    --green-soft: #2E3626;
    --line: #3A3625;
    --grid: #28251C;
    --yellow: #DAC070;
    --yellow-soft: #3A3220;
    --pink: #D8A89C;
    --pink-soft: #3B2924;
    --blue: #A8BCC8;
    --blue-soft: #2A3540;
    --purple: #B9A8C8;
    --code-bg: #121009;
  }
  /* Dark-mode fixups for hardcoded colors that break readability */
  :root[data-theme="dark"] .callout.yellow .label { color: #E5C870; }
  :root[data-theme="dark"] .callout.pink .label { color: #E8B9AB; }
  :root[data-theme="dark"] .callout.yellow { border-color: #8A7838; }
  :root[data-theme="dark"] .callout.pink { border-color: #8B5E52; }
  :root[data-theme="dark"] .callout { border-color: #5A6F4D; }
  :root[data-theme="dark"] .home .card:hover { border-color: var(--green); }
  :root[data-theme="dark"] .home .card .pill.cont { background: var(--yellow-soft); color: #E5C870; border-color: #8A7838; }
  :root[data-theme="dark"] .home .card { background: var(--bg-panel); }
  :root[data-theme="dark"] .home .card.c1 { background: linear-gradient(140deg, #24221A 60%, #2E3626); }
  :root[data-theme="dark"] .home .card.c2 { background: linear-gradient(140deg, #24221A 60%, #3A3220); }
  :root[data-theme="dark"] .home .card.c3 { background: linear-gradient(140deg, #24221A 60%, #3B2924); }
  :root[data-theme="dark"] .home .card.c4 { background: linear-gradient(140deg, #24221A 60%, #2A3540); }
  :root[data-theme="dark"] .home .card.c5 { background: linear-gradient(140deg, #24221A 60%, #332A3A); }
  :root[data-theme="dark"] .home .card.c6 { background: linear-gradient(140deg, #24221A 60%, #332E22); }
  :root[data-theme="dark"] .home .card.c7 { background: linear-gradient(140deg, #24221A 60%, #28313A); }
  :root[data-theme="dark"] .home .card.c8 { background: linear-gradient(140deg, #24221A 60%, #3D2E24); }
  :root[data-theme="dark"] .home .card.c9 { background: linear-gradient(140deg, #24221A 60%, #302D26); }
  :root[data-theme="dark"] .home .card.c10 { background: linear-gradient(140deg, #24221A 60%, #263430); }
  :root[data-theme="dark"] .home .card.c11 { background: linear-gradient(140deg, #24221A 60%, #342C34); }
  :root[data-theme="dark"] .home .card.c12 { background: linear-gradient(140deg, #24221A 60%, #35301F); }
  :root[data-theme="dark"] .home .glossary-cta { background: linear-gradient(140deg, #24221A 55%, #3B2924); }
  :root[data-theme="dark"] .home .glossary-cta.cta-play { background: linear-gradient(140deg, #24221A 55%, #28313A); }
  :root[data-theme="dark"] .home .glossary-cta .btn { color: var(--bg); }
  :root[data-theme="dark"] .home .card .pill.done { color: var(--bg); }
  :root[data-theme="dark"] .logo em { color: #1A1812; }
  :root[data-theme="dark"] h1.title em { color: #1A1812; }
  :root[data-theme="dark"] .home h1 em { color: #1A1812; }
  :root[data-theme="dark"] .pill.idea,
  :root[data-theme="dark"] .pill.tech { color: #1A1812; }

  /* Theme toggle button */
  .theme-toggle {
    width: 36px; height: 36px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); background: var(--bg-panel);
    color: var(--ink-soft); font-size: 16px; cursor: pointer;
    transition: background .18s, border-color .18s, color .18s;
    margin-left: 6px;
  }
  .theme-toggle:hover { background: var(--green-soft); border-color: var(--green); color: var(--green); }
  .theme-toggle:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Serif SC", "Fraunces", "Noto Sans SC", serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    background-image:
      linear-gradient(to right, var(--grid) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    background-position: -1px -1px;
    min-height: 100vh;
  }
  a { color: var(--green); text-decoration: none; }
  a:hover { opacity: .8; }

  /* Header */
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 28px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    position: sticky; top: 0; z-index: 10;
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    font-family: "Fraunces", "Noto Serif SC", serif;
    font-weight: 600; font-size: 20px;
    color: var(--ink); cursor: pointer;
  }
  .logo .mark {
    width: 30px; height: 30px; border-radius: 7px;
    background: var(--green-soft); border: 1px solid #B9CDA7;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: "JetBrains Mono", monospace; font-weight: 600; color: var(--green);
  }
  .logo em {
    font-style: normal; color: var(--green); background: var(--green-bright);
    padding: 0 6px; border-radius: 4px;
  }
  .lesson-nav {
    margin-left: auto;
    display: flex; align-items: center; gap: 8px;
    font-family: "JetBrains Mono", monospace; font-size: 11px;
    color: var(--ink-soft);
  }
  .lesson-nav .n-btn {
    padding: 6px 10px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg-panel);
    color: var(--ink); cursor: pointer;
    font-family: inherit; font-size: 11px;
  }
  .lesson-nav .n-btn:hover { background: var(--green-soft); }
  .lesson-nav .n-btn[disabled] { opacity: .35; cursor: default; }
  .lesson-nav .n-cur {
    padding: 4px 10px; border-radius: 999px;
    background: var(--green-soft); color: var(--green);
    border: 1px solid #B9CDA7;
  }

  /* HOME */
  .home {
    max-width: 960px; margin: 0 auto;
    padding: 60px 28px 80px;
  }
  .home h1 {
    font-family: "Noto Serif SC", "Fraunces", serif;
    font-weight: 700; font-size: 52px; line-height: 1.1;
    margin: 0 0 16px; letter-spacing: -0.02em;
  }
  .home h1 em {
    font-style: normal; color: var(--green); background: var(--green-bright);
    padding: 2px 10px; border-radius: 8px;
  }
  .home .lede {
    font-size: 18px; color: var(--ink-soft); line-height: 1.6;
    max-width: 640px; margin: 0 0 20px;
  }
  .home .meta {
    display: inline-flex; gap: 10px; margin-bottom: 36px;
    font-family: "JetBrains Mono", monospace; font-size: 11px;
    color: var(--ink-soft);
  }
  .home .meta span {
    padding: 5px 10px; background: var(--bg-panel);
    border: 1px solid var(--line); border-radius: 999px;
  }
  .home h2 {
    font-family: "JetBrains Mono", monospace; font-size: 11px;
    color: var(--ink-soft); letter-spacing: 0.1em; text-transform: uppercase;
    margin: 32px 0 14px;
  }
  .home .toc {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 14px;
  }
  .home .card {
    background: var(--bg-panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 20px 22px;
    cursor: pointer; display: block;
    transition: transform .15s ease, border-color .15s ease;
    color: var(--ink);
    position: relative; overflow: hidden;
  }
  .home .card:hover { transform: translateY(-2px); border-color: #B9CDA7; }
  .home .card .num {
    font-family: "JetBrains Mono", monospace; font-size: 11px;
    color: var(--ink-soft); letter-spacing: 0.08em;
    margin-bottom: 10px;
  }
  .home .card h3 {
    font-family: "Noto Serif SC", "Fraunces", serif; font-weight: 700;
    font-size: 22px; margin: 0 0 8px; line-height: 1.3;
  }
  .home .card p {
    font-size: 13px; color: var(--ink-soft); line-height: 1.55; margin: 0 0 14px;
  }
  .home .card .foot {
    display: flex; justify-content: space-between; align-items: center;
    font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--ink-soft);
  }
  .home .card .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 9px; border-radius: 999px;
    background: var(--green-soft); color: var(--green);
    border: 1px solid #B9CDA7; font-size: 10px; font-weight: 500;
  }
  .home .card .pill.cont { background: var(--yellow-soft); color: #7B6314; border-color: #DCC673; }
  .home .card .pill.done { background: var(--green); color: var(--bg-panel); border-color: var(--green); }
  .home .card.c1 { background: linear-gradient(140deg, #FAF7EC 60%, #E4ECD6); }
  .home .card.c2 { background: linear-gradient(140deg, #FAF7EC 60%, #FBF1C0); }
  .home .card.c3 { background: linear-gradient(140deg, #FAF7EC 60%, #F9E3DC); }
  .home .card.c4 { background: linear-gradient(140deg, #FAF7EC 60%, #E3EBF0); }
  .home .card.c5 { background: linear-gradient(140deg, #FAF7EC 60%, #EFE5F3); }
  .home .card.c6 { background: linear-gradient(140deg, #FAF7EC 60%, #EDE2CE); }
  .home .card.c7 { background: linear-gradient(140deg, #FAF7EC 60%, #DDE6E8); }
  .home .card.c8 { background: linear-gradient(140deg, #FAF7EC 60%, #F5D8C4); }
  .home .card.c9 { background: linear-gradient(140deg, #FAF7EC 60%, #DAD5CE); }
  .home .card.c10 { background: linear-gradient(140deg, #FAF7EC 60%, #C9DDD7); }
  .home .card.c11 { background: linear-gradient(140deg, #FAF7EC 60%, #E3D5E2); }
  .home .card.c12 { background: linear-gradient(140deg, #FAF7EC 60%, #E6D8B8); }

  .home .footer {
    margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--line);
    font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--ink-soft);
    display: flex; gap: 20px; flex-wrap: wrap;
  }

  /* LESSON */
  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    gap: 24px;
    padding: 24px 28px 48px;
    max-width: 1280px;
    margin: 0 auto;
  }
  .stage { min-width: 0; }
  .crumb {
    font-family: "JetBrains Mono", monospace;
    font-size: 12px; color: var(--ink-soft);
    letter-spacing: 0.02em;
    margin-bottom: 8px;
  }
  .crumb a { color: var(--ink-soft); }
  .crumb a:hover { color: var(--green); }
  h1.title {
    font-family: "Noto Serif SC", "Fraunces", serif;
    font-weight: 700; font-size: 36px; line-height: 1.2;
    margin: 0 0 10px; letter-spacing: -0.01em;
  }
  .tags { display: inline-flex; gap: 8px; margin-left: 10px; vertical-align: middle; }
  .tag {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px;
    background: var(--bg-panel); border: 1px solid var(--line);
    font-family: "JetBrains Mono", monospace; font-size: 11px;
    color: var(--ink); font-weight: 500;
  }
  .tag.yellow { background: var(--yellow); border-color: #DCC673; color: #7B6314; }
  .tag.green { background: var(--green-soft); border-color: #B9CDA7; color: var(--green); }
  .tag.blue { background: var(--blue); border-color: #A0B2BE; color: #3C5565; }
  .subtitle { color: var(--ink-soft); font-size: 15px; margin: 0 0 14px; max-width: 640px; }
  .prereq {
    font-family: "JetBrains Mono", monospace; font-size: 11px;
    color: var(--ink-soft); letter-spacing: 0.08em;
    margin: 0 0 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  }
  .prereq a {
    color: var(--green); text-decoration: none; padding: 3px 9px;
    border: 1px solid var(--line); border-radius: 6px;
    font-family: "Noto Serif SC", serif; font-size: 12.5px; letter-spacing: 0;
  }
  .prereq a:hover { border-color: var(--green); background: var(--green-soft); }
  .prereq .sep { color: var(--ink-soft); opacity: 0.5; }

  .stat-row {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    margin: 14px 0 14px;
  }
  .stat {
    background: var(--bg-panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px;
  }
  .stat .k {
    font-family: "JetBrains Mono", monospace; font-size: 10px;
    color: var(--ink-soft); letter-spacing: 0.08em; text-transform: uppercase;
    display: flex; align-items: center; gap: 6px;
  }
  .stat .v {
    font-family: "JetBrains Mono", monospace; font-size: 14.5px;
    color: var(--ink); margin-top: 6px; min-height: 18px; font-weight: 500;
    transition: color .3s ease;
  }
  .canvas {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    aspect-ratio: 800 / 600;
    position: relative;
    background-image: radial-gradient(circle at 1px 1px, var(--grid) 1px, transparent 0);
    background-size: 16px 16px;
    overflow: hidden;
  }
  .canvas svg { width: 100%; height: 100%; display: block; }
  .ctrls {
    position: absolute; right: 12px; bottom: 12px;
    display: flex; gap: 6px;
  }
  .ctrls button {
    width: 34px; height: 34px; border-radius: 8px;
    background: var(--bg); border: 1px solid var(--line); color: var(--ink);
    font-family: "JetBrains Mono", monospace; font-size: 14px;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .15s ease;
  }
  .ctrls button:hover { background: var(--green-soft); }
  .timeline {
    margin-top: 18px;
    background: var(--bg-panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px 18px;
  }
  .tl-head {
    display: flex; justify-content: space-between;
    font-family: "JetBrains Mono", monospace; font-size: 11px;
    color: var(--ink-soft); letter-spacing: 0.08em; text-transform: uppercase;
    margin-bottom: 14px;
  }
  .tl-steps {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 4px; align-items: start;
    position: relative;
  }
  .tl-steps::before {
    content: ""; position: absolute; left: 14px; right: 14px; top: 14px;
    height: 1px; background: var(--line); z-index: 0;
  }
  .tl-step {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    position: relative;
  }
  .tl-dot {
    width: 30px; height: 30px; border-radius: 999px;
    border: 1.5px solid var(--line); background: var(--bg-panel);
    display: inline-flex; align-items: center; justify-content: center;
    font-family: "JetBrains Mono", monospace; font-size: 13px;
    color: var(--ink-soft); font-weight: 500;
    position: relative; z-index: 1;
    transition: all .2s ease;
  }
  .tl-step.done .tl-dot { border-color: var(--green); color: var(--green); background: var(--green-soft); }
  .tl-step.active .tl-dot {
    border-color: var(--green); background: var(--green); color: #FAF7EC;
    box-shadow: 0 0 0 4px var(--green-soft);
  }
  .tl-label {
    font-size: 11px; color: var(--ink-soft);
    font-family: "JetBrains Mono", monospace;
    text-align: center; min-height: 14px;
  }
  .tl-step.active .tl-label { color: var(--ink); }

  aside.panel {
    background: var(--bg-panel); border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px 22px 18px;
    align-self: start;
    position: sticky; top: 72px;
  }
  .panel-head {
    display: flex; justify-content: space-between; align-items: center;
    font-family: "JetBrains Mono", monospace; font-size: 11px;
    color: var(--ink-soft); letter-spacing: 0.08em; text-transform: uppercase;
    margin-bottom: 12px;
  }
  .panel-head .pill {
    display: inline-block; padding: 4px 10px; border-radius: 999px;
    background: var(--pink); color: #8B4B3F; border: 1px solid #DBB1A6;
    font-size: 10px; font-weight: 500;
  }
  .panel-head .pill.tech { background: var(--yellow); color: #7B6314; border-color: #DCC673; }
  .panel-head .pill.idea { background: var(--green-soft); color: var(--green); border-color: #B9CDA7; }
  h2.step-title {
    font-family: "Noto Serif SC", "Fraunces", serif;
    font-weight: 700; font-size: 20px; margin: 0 0 12px; line-height: 1.35;
  }
  .panel p { font-size: 14px; line-height: 1.6; color: var(--ink); margin: 0 0 12px; }
  .panel code {
    font-family: "JetBrains Mono", monospace; font-size: 12.5px;
    background: var(--bg); padding: 1px 6px; border-radius: 4px;
    border: 1px solid var(--line); color: var(--green);
  }
  .panel strong { color: var(--ink); font-weight: 700; }
  .callout {
    background: var(--green-soft); border: 1px solid #B9CDA7;
    border-radius: 10px; padding: 12px 14px; margin: 14px 0;
  }
  .callout .label {
    font-family: "JetBrains Mono", monospace; font-size: 10px;
    color: var(--green); letter-spacing: 0.1em;
    margin-bottom: 6px; display: flex; align-items: center; gap: 8px;
    font-weight: 600;
  }
  .callout .label .ic {
    display: inline-flex; width: 20px; height: 20px; border-radius: 5px;
    background: var(--bg-panel); align-items: center; justify-content: center;
    font-size: 12px;
  }
  .callout.yellow { background: var(--yellow-soft); border-color: #DCC673; }
  .callout.yellow .label { color: #7B6314; }
  .callout.pink { background: var(--pink-soft); border-color: #DBB1A6; }
  .callout.pink .label { color: #8B4B3F; }
  .callout p { font-size: 13.5px; margin: 0; line-height: 1.55; }

  .nav {
    display: grid; grid-template-columns: auto 1fr; gap: 8px;
    margin: 16px 0 12px;
  }
  .nav button {
    padding: 11px 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg);
    font-family: "Noto Serif SC", serif; font-size: 14px;
    color: var(--ink); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: background .15s ease, opacity .2s ease;
  }
  .nav button.next {
    background: var(--green); color: #FAF7EC; border-color: var(--green);
    font-weight: 600; justify-content: space-between;
  }
  .nav button:hover:not([disabled]) { opacity: .88; }
  .nav button[disabled] { opacity: .35; cursor: default; }
  .hints {
    font-family: "JetBrains Mono", monospace; font-size: 10.5px; color: var(--ink-soft);
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding-top: 2px;
  }
  .kbd {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 20px; height: 20px; padding: 0 6px;
    border: 1px solid var(--line); border-radius: 4px; background: var(--bg);

            <p><strong>② Reranking (两阶段检索)</strong>: 先用 cosine 粗召回 top-50 (快, 不精), 再用更贵的 cross-encoder (cohere-rerank / bge-reranker) 精排序, 最后取 top-5 送 LLM。精度明显涨, 延迟稍增。</p>

      : `场景 / 辨析 / 取舍 / 调试, 比基础考难一个台阶。单选, 每题 ${points} 分, 没时限。`;

    const modeTabs = `
      <div class="quiz-mode-tabs">
        <button class="qmtab ${quizMode === "basic" ? "active" : ""}" data-mode="basic">基础 · ${quizBasic.length} 题</button>
        <button class="qmtab ${quizMode === "deep" ? "active" : ""}" data-mode="deep">深度 · ${quizDeep.length} 题</button>
      </div>
    `;

    const pct = fullScore > 0 ? score / fullScore : 0;
    const scoreBar = submitted ? `
      <div class="quiz-score-bar">
        <div><span class="n">${score}</span> <span class="txt">/ ${fullScore}</span></div>
        <div class="txt">答对 ${correctCount} / ${total} · ${pct >= 0.8 ? (quizMode === "basic" ? "基础很稳" : "深度也拿下了") : pct >= 0.6 ? "过了, 还能再读一遍" : (quizMode === "basic" ? "建议回去再看一遍深入课和术语库" : "场景题要结合实践, 回头看看 lesson 4/5")}</div>
      </div>
    ` : "";

    const items = quiz.map((q, i) => {
      const userChoice = answers[i];
      const isCorrect = submitted && userChoice === q.correct;
      const isWrong = submitted && userChoice !== null && userChoice !== q.correct;
      const cardClass = submitted ? (isCorrect ? "correct" : (isWrong ? "wrong" : "")) : "";

      const optionsHtml = q.options.map((opt, j) => {
        let cls = "q-opt";
        if (submitted) {
          cls += " is-disabled";
          if (j === q.correct) cls += " is-correct";
          else if (userChoice === j) cls += " is-wrong";
        } else if (userChoice === j) {
          cls += " is-selected";
        }
        return `
          <label class="${cls}">
            <input type="radio" name="q${i}" value="${j}" ${userChoice === j ? "checked" : ""} ${submitted ? "disabled" : ""}>
            <span class="opt-letter">${"ABCD"[j]}</span>
            <span class="opt-text">${opt}</span>
          </label>
        `;
      }).join("");

      const explain = submitted ? `
        <div class="q-explain">
          <span class="verdict ${isCorrect ? "v-ok" : "v-no"}">${isCorrect ? "答对" : (userChoice === null ? "未作答" : "答错")}</span>
          <a class="src-link" href="${quizSourceHref(q.from)}">→ ${quizSourceLabel(q.from)}</a>
          <span class="expl">${q.explain}</span>
        </div>
      ` : "";

      return `
        <div class="quiz-q ${cardClass}">
          <div class="q-head">
            <span class="q-num">${i + 1}</span>
            <span class="q-text">${q.q}</span>
            <span class="q-source">${quizSourceLabel(q.from)}</span>
          </div>
          <div class="q-options">${optionsHtml}</div>
          ${explain}

    }).join("");

    const statsHtml = submitted ? `
      <div class="quiz-stats">
        <div class="stat good"><div class="k">答对</div><div class="v">${correctCount}</div></div>
        <div class="stat bad"><div class="k">答错</div><div class="v">${answered - correctCount}</div></div>
        <div class="stat"><div class="k">未答</div><div class="v">${total - answered}</div></div>
      </div>
    ` : "";

    app.innerHTML = `
      <div class="quiz-page">
        <h1>考试 · ${modeTitle}</h1>
        <p class="lede">${modeLede}</p>

  // Reading progress (per-device, localStorage; silent on failure — private mode etc.)
  const PROG_KEY = "agentatlas.progress.v1";
  function readProg() {
    try { return JSON.parse(localStorage.getItem(PROG_KEY) || "{}"); }
    catch { return {}; }
  }
  function saveProg(slug, step) {
    try {
      const p = readProg();
      p[slug] = Math.max(p[slug] || 0, step);
      localStorage.setItem(PROG_KEY, JSON.stringify(p));
    } catch {}
  }
  function progBadge(lesson) {
    const s = readProg()[lesson.slug] || 0;
    if (!s) return `<span class="pill">开始 →</span>`;
    if (s >= lesson.stepCount) return `<span class="pill done">✓ 读完 · 复习</span>`;
    return `<span class="pill cont">继续 · 第 ${s}/${lesson.stepCount} 步 →</span>`;
  }

  function parseRoute() {
    const h = location.hash.replace(/^#\/?/, "");
    if (!h) return { page: "home" };
    const parts = h.split("/");
    if (parts[0] === "quiz") return { page: "quiz" };
    if (parts[0] === "play") {
      if (parts[1] === "prompt") return { page: "play-prompt" };
      if (parts[1] === "rag") return { page: "play-rag" };
      if (parts[1] === "workflow") return { page: "play-workflow" };
      if (parts[1] === "mcp") return { page: "play-mcp" };
      if (parts[1] === "memory") return { page: "play-memory" };
      return { page: "play-hub" };
    }
    if (parts[0] === "glossary") {
      if (!parts[1]) return { page: "glossary-home" };
      const term = terms.find(t => t.slug === parts[1]);
      if (!term) return { page: "glossary-home" };
      return { page: "term", term };
    }
    const slug = parts[0];
    const lesson = lessons.find(l => l.slug === slug);
    if (!lesson) return { page: "home" };
    const step = Math.max(1, Math.min(lesson.stepCount, parseInt(parts[1], 10) || 1));
    return { page: "lesson", lesson, step };
  }

    const cur = document.documentElement.getAttribute("data-theme");

    document.documentElement.setAttribute("data-theme", next);

  function renderStep() {
    const step = lesson.steps[cur];
    const scene = document.getElementById("scene");

    document.getElementById("p-num").textContent = cur + 1;
    const pill = document.getElementById("p-pill");
    pill.textContent = step.pill;
    pill.className = "pill " + (step.pillClass || "");
    document.getElementById("p-title").textContent = step.title;
    document.getElementById("p-body").innerHTML = step.body;

    const btnNext = document.getElementById("btn-next");
    const btnBack = document.getElementById("btn-back");
    btnNext.textContent = step.next;
    btnBack.disabled = cur === 0;

    const i = lessons.indexOf(lesson);
    const nextLesson = lessons[i + 1];
    const nextBox = document.getElementById("next-lesson");

    if (cur === lesson.stepCount - 1) {
      btnNext.disabled = !nextLesson;
      if (nextLesson) {
        btnNext.onclick = () => go(nextLesson.slug);
        btnNext.textContent = `进入 ${nextLesson.num}. ${nextLesson.slug} →`;
      } else {
        btnNext.onclick = () => go("");
        btnNext.textContent = "回首页 ◆";
        btnNext.disabled = false;
      }
      nextBox.classList.add("show");
    } else {
      btnNext.onclick = nextStep;
      nextBox.classList.remove("show");
    }

    document.getElementById("tl-cur").textContent = cur + 1;
    document.querySelectorAll(".tl-step").forEach((el, j) => {
      el.classList.toggle("done", j < cur);
      el.classList.toggle("active", j === cur);
    });
    document.querySelectorAll("#learn-list li").forEach((el, j) => {
      el.classList.toggle("done", j <= cur);
    });
    step.stats.forEach((v, j) => {
      const el = document.getElementById("s-" + j);
      if (el) el.textContent = v;
    });

    const stepNum = cur + 1;
    scene.querySelectorAll("[data-show]").forEach(el => {
      const shows = el.getAttribute("data-show").split(",").map(s => +s.trim());
      el.classList.toggle("on", shows.includes(stepNum));
    });

    // retrigger arrow draw
    scene.querySelectorAll(".arrow").forEach(a => a.style.animation = "none");
    requestAnimationFrame(() => {
      scene.querySelectorAll(".arrow").forEach(a => a.style.animation = "");
    });

    history.replaceState(null, "", "#/" + lesson.slug + "/" + (cur + 1));
    saveProg(lesson.slug, cur + 1);
  }

  function nextStep() { if (cur < lesson.stepCount - 1) { cur++; renderStep(); } }
  function prevStep() { if (cur > 0) { cur--; renderStep(); } }
  function replay() { renderStep(); }

  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
    if (!lesson) return;
    if (e.key === "ArrowRight" || e.code === "Space") { e.preventDefault(); nextStep(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); prevStep(); }
    else if (e.key.toLowerCase() === "r") { replay(); }
  });

    function update() {
      const level = state.level;
      const q = queries.find(x => x.key === state.qKey);
      const chunks = corpusChunks[level];
      const sims = scores[state.qKey][level];
      const actualK = Math.min(state.k, chunks.length);

      const ranked = chunks.map((c, i) => ({ c, sim: sims[i], i }))
        .sort((a, b) => b.sim - a.sim);
      const topIds = new Set(ranked.slice(0, actualK).map(x => x.c.id));

      document.getElementById("rag-chunks").innerHTML = chunks.map((c, i) => `
        <div class="chunk-item ${topIds.has(c.id) ? 'hit' : ''}">
          <span class="cid">${c.id}</span>
          <span class="ctxt">${escapeHtml(c.text)}</span>
          <span class="sim">${sims[i].toFixed(2)}</span>
        </div>
      `).join("");

      document.getElementById("rag-ranked").innerHTML = ranked.slice(0, actualK).map((r, idx) => `
        <div class="ranked-item">
          <span class="rank">#${idx+1}</span>
          <span class="ctxt">[${r.c.id}] ${escapeHtml(r.c.text)}</span>
          <div class="bar"><span style="width:${(r.sim*100).toFixed(0)}%"></span></div>
          <span class="sim">${r.sim.toFixed(2)}</span>
        </div>
      `).join("");

      const promptBody = ranked.slice(0, actualK).map(r =>
        `<span class="tag">[${r.c.id}]</span> ${escapeHtml(r.c.text)}`
      ).join("\n");
      document.getElementById("rag-prompt").innerHTML =
`请根据以下片段回答问题, 片段里没有就说没有, 不要编造。

${promptBody}

问题: ${escapeHtml(q.text)}`;

      document.getElementById("rag-answer").textContent = q.answer;
      document.getElementById("rag-size-label").textContent = `(${chunkSizeLabel[level]})`;
      document.getElementById("rag-k-echo").textContent = actualK;
    }

    document.querySelectorAll("#rag-queries .preset").forEach(btn => {
      btn.addEventListener("click", () => {
        state.qKey = btn.dataset.qkey;
        document.querySelectorAll("#rag-queries .preset").forEach(b => b.classList.toggle("active", b.dataset.qkey === state.qKey));
        update();
      });
    });
    document.querySelectorAll("#rag-level .pill-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        state.level = btn.dataset.level;
        document.querySelectorAll("#rag-level .pill-btn").forEach(b => b.classList.toggle("active", b.dataset.level === state.level));
        update();
      });
    });
    document.querySelectorAll("#rag-k .pill-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        state.k = parseInt(btn.dataset.k, 10);
        document.querySelectorAll("#rag-k .pill-btn").forEach(b => b.classList.toggle("active", parseInt(b.dataset.k, 10) === state.k));
        update();
      });
    });

    update();
  }

    function msgs() { return traces[state.traceKey].messages; }

    function fmtDetail(obj) {
      // minimal JSON-ish formatter with tiny syntax coloring
      const json = JSON.stringify(obj, null, 2);
      return json
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/("[a-zA-Z_][a-zA-Z0-9_]*")(\s*:)/g, '<span class="k">$1</span>$2')
        .replace(/:\s*(".*?")/g, ': <span class="s">$1</span>')
        .replace(/:\s*(true|false|null)/g, ': <span class="n">$1</span>')
        .replace(/:\s*(-?\d+(?:\.\d+)?)/g, ': <span class="n">$1</span>')
        .replace(/(&quot;error&quot;|is_error)/g, '<span class="err">$1</span>');
    }

    function renderTimeline() {
      const list = msgs();
      document.getElementById("wf-timeline").innerHTML = list.map((m, i) => {
        const cls = [
          "wf-step-item",
          "role-" + m.role,
          m.error ? "error" : "",
          i < state.cur ? "done" : "",
          i === state.cur ? "current" : "",
        ].filter(Boolean).join(" ");
        return `
          <div class="${cls}" data-i="${i}">
            <div class="dot"></div>
            <div class="wf-role">t=${i+1} ${m.role}${m.error ? " ⚠" : ""}</div>
            <div class="wf-label">${escapeHtml(m.label)}</div>
          </div>
        `;
      }).join("");
      document.querySelectorAll("#wf-timeline .wf-step-item").forEach(el => {
        el.addEventListener("click", () => {
          state.cur = parseInt(el.dataset.i, 10);
          pause();
          update();
        });
      });
    }

    function renderDetail() {
      const m = msgs()[state.cur];
      document.getElementById("wf-detail").innerHTML = fmtDetail(m.detail);
    }

    function update() {
      const list = msgs();
      document.getElementById("wf-step-i").textContent = state.cur + 1;
      document.getElementById("wf-step-n").textContent = list.length;
      document.getElementById("wf-prev").disabled = state.cur === 0;
      document.getElementById("wf-next").disabled = state.cur >= list.length - 1;
      document.getElementById("wf-play").textContent = state.playing ? "▋" : "▶";
      renderTimeline();
      renderDetail();
    }

    function play() {
      if (state.cur >= msgs().length - 1) state.cur = 0;
      state.playing = true;
      update();
      state.timer = setInterval(() => {
        if (state.cur < msgs().length - 1) {
          state.cur++;
          update();
        } else {
          pause();
        }
      }, 1300);
    }

    function pause() {
      state.playing = false;
      if (state.timer) { clearInterval(state.timer); state.timer = null; }
      const btn = document.getElementById("wf-play");
      if (btn) btn.textContent = "▶";
    }

    document.querySelectorAll("#wf-traces .preset").forEach(btn => {
      btn.addEventListener("click", () => {
        pause();
        state.traceKey = btn.dataset.trace;
        state.cur = 0;
        document.querySelectorAll("#wf-traces .preset").forEach(b => b.classList.toggle("active", b.dataset.trace === state.traceKey));
        update();
      });
    });

    document.getElementById("wf-prev").addEventListener("click", () => {
      pause();
      if (state.cur > 0) { state.cur--; update(); }
    });
    document.getElementById("wf-next").addEventListener("click", () => {
      pause();
      if (state.cur < msgs().length - 1) { state.cur++; update(); }
    });
    document.getElementById("wf-play").addEventListener("click", () => {
      state.playing ? pause() : play();
    });
    document.getElementById("wf-reset").addEventListener("click", () => {
      pause();
      state.cur = 0;
      update();
    });

    update();
  }

            reply: '"爱吃辣, 不吃香菜 (从长期存储读到)。"',
            outcome: "ok", outcomeText: "✓ 从长期读出",
          },
        },
      },
      {
        key: "t3",
        label: "一周后 · 新 session, 新设备",
        ask: '"我叫啥来着?"',
        cols: {
          none: {
            ctx: [
              { role: "system", text: "你是一个助手。" },
              { role: "user", cur: true, text: "我叫啥来着?" },
            ],
            reply: '"不知道, 你没告诉我。"',
            outcome: "fail", outcomeText: "✗ 不记得",
          },
          short: {
            ctx: [
              { role: "system", text: "你是一个助手。" },
              { role: "user", cur: true, text: "我叫啥来着?" },
            ],
            reply: '"不知道 — 新 session, 之前的 context 没了。"',
            outcome: "fail", outcomeText: "✗ 换 session 就丢",
          },
          long: {
            ctx: [
              { role: "system", text: 'system + [存储读出] { name: "张三", diet: ["辣"], avoid: ["香菜"], last_seen: "2026-11-13" }' },
              { role: "user", cur: true, text: "我叫啥来着?" },
            ],
            reply: '"你叫张三。(一周前你告诉我的, 存在长期)"',
            outcome: "ok", outcomeText: "✓ 跨 session 认得",
          },
        },
      },
    ];

    const COLS = [
      { key: "none",  title: "① 无记忆",            sub: "每次调用都独立, 什么都不留" },
      { key: "short", title: "② 短期 · context",   sub: "历史重发进 context (关 session = 没)" },
      { key: "long",  title: "③ 长期 · 持久化",     sub: "外部 KV / 向量库, 按需读写" },
    ];

    const state = { turnKey: "t1" };

    app.innerHTML = `
      <div class="play-page">
        <div class="crumb"><a href="#/play">← 实验</a> / 05 · Memory Simulator</div>
        <h1>Memory Simulator</h1>
        <p class="lede">同一段对话, 三种 memory 策略 (无 / 短期 context / 长期持久化) 分别看到什么、答成啥样。选一轮, 对比三栏。呼应 Lesson 06 memory。</p>

        <div class="mem-ask">
          <div class="mem-ask-k">本轮用户问</div>
          <div id="mem-ask-text">"你好, 我叫张三, 爱吃辣, 不吃香菜。"</div>
        </div>

        <div class="presets mem-turns" id="mem-turns">
          ${turns.map(t => `<button class="preset ${t.key===state.turnKey?'active':''}" data-turn="${t.key}">${escapeHtml(t.label)}</button>`).join("")}
        </div>

        <div class="mem-grid" id="mem-grid"></div>

        <div class="mem-tips">
          <strong>一句话</strong> · 短期 = 把历史塞回 context (Lesson 01 chat 里讲的"每轮重发");
          长期 = 把关键事写进外部存储, 用的时候读出来拼进 system prompt (Lesson 06 memory 里的 KV / 摘要 / 检索式)。
          模型永远只看 context, memory 的工程全在它外面。
        </div>
      </div>
    `;

    function fmtCtx(msgs) {
      return msgs.map(m => {
        const text = escapeHtml(m.text);
        const histCls = m.hist ? "r-hist " : "";
        const curCls = m.cur ? "r-cur " : "";
        const roleMap = {
          system: `<span class="r-sys">system</span>`,
          user: `<span class="r-user">user</span>`,
          assistant: `<span class="r-asst">assistant</span>`,
          "memory-write": `<span class="r-mem">[write-mem]</span>`,
        };
        const roleLabel = roleMap[m.role] || m.role;
        return `<span class="${histCls}${curCls}">${roleLabel}: ${text}</span>`;
      }).join("\n");
    }

    function render() {
      const turn = turns.find(t => t.key === state.turnKey);
      document.getElementById("mem-ask-text").textContent = turn.ask;
      document.getElementById("mem-grid").innerHTML = COLS.map(col => {
        const c = turn.cols[col.key];
        return `
          <div class="mem-col ${col.key}">
            <h3>${col.title}</h3>
            <div class="mem-sub">${col.sub}</div>
            <div class="mem-ctx">${fmtCtx(c.ctx)}</div>
            <div class="mem-reply">
              <div class="k">模型回答</div>
              <div>${escapeHtml(c.reply)}</div>
            </div>
            <div class="mem-outcome ${c.outcome}">${c.outcomeText}</div>
          </div>
        `;
      }).join("");
    }

    document.querySelectorAll("#mem-turns .preset").forEach(btn => {
      btn.addEventListener("click", () => {
        state.turnKey = btn.dataset.turn;
        document.querySelectorAll("#mem-turns .preset").forEach(b => b.classList.toggle("active", b.dataset.turn === state.turnKey));
        render();
      });
    });

    render();
  }

  function route() {
    const r = parseRoute();
    renderNav(r);
    if (r.page === "home") { lesson = null; renderHome(); }
    else if (r.page === "glossary-home") { lesson = null; renderGlossaryHome(); }
    else if (r.page === "term") { lesson = null; renderTermPage(r.term); }
    else if (r.page === "quiz") { lesson = null; renderQuiz(); }
    else if (r.page === "play-hub") { lesson = null; renderPlayHub(); }
    else if (r.page === "play-prompt") { lesson = null; renderPlayPrompt(); }
    else if (r.page === "play-rag") { lesson = null; renderPlayRag(); }
    else if (r.page === "play-workflow") { lesson = null; renderPlayWorkflow(); }
    else if (r.page === "play-mcp") { lesson = null; renderPlayMCP(); }
    else if (r.page === "play-memory") { lesson = null; renderPlayMemory(); }
    else { renderLesson(r); }
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
</script>
</body>
</html>
