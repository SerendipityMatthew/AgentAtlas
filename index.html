<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Atlas · 一本关于 AI Agent 的小书</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F0ECE0;
    --bg-panel: #FAF7EC;
    --ink: #2C2820;
    --ink-soft: #6B6454;
    --green: #3D5D3C;
    --green-bright: #D5EC9B;
    --green-soft: #E4ECD6;
    --line: #DDD6C2;
    --grid: #E5DFC8;
    --yellow: #F5E9A8;
    --yellow-soft: #FBF1C0;
    --pink: #F2D3CB;
    --pink-soft: #F9E3DC;
    --blue: #CDD9E0;
    --blue-soft: #E3EBF0;
    --purple: #D6CDE0;
    --code-bg: #262319;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Serif SC", "Fraunces", "Noto Sans SC", serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    background-image:
      linear-gradient(to right, var(--grid) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    background-position: -1px -1px;
    min-height: 100vh;
  }
  a { color: var(--green); text-decoration: none; }
  a:hover { opacity: .8; }

  /* Header */
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 28px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    position: sticky; top: 0; z-index: 10;
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    font-family: "Fraunces", "Noto Serif SC", serif;
    font-weight: 600; font-size: 20px;
    color: var(--ink); cursor: pointer;
  }
  .logo .mark {
    width: 30px; height: 30px; border-radius: 7px;
    background: var(--green-soft); border: 1px solid #B9CDA7;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: "JetBrains Mono", monospace; font-weight: 600; color: var(--green);
  }
  .logo em {
    font-style: normal; color: var(--green); background: var(--green-bright);
    padding: 0 6px; border-radius: 4px;
  }
  .lesson-nav {
    margin-left: auto;
    display: flex; align-items: center; gap: 8px;
    font-family: "JetBrains Mono", monospace; font-size: 11px;
    color: var(--ink-soft);
  }
  .lesson-nav .n-btn {
    padding: 6px 10px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg-panel);
    color: var(--ink); cursor: pointer;
    font-family: inherit; font-size: 11px;
  }
  .lesson-nav .n-btn:hover { background: var(--green-soft); }
  .lesson-nav .n-btn[disabled] { opacity: .35; cursor: default; }
  .lesson-nav .n-cur {
    padding: 4px 10px; border-radius: 999px;
    background: var(--green-soft); color: var(--green);
    border: 1px solid #B9CDA7;
  }

  /* HOME */
  .home {
    max-width: 960px; margin: 0 auto;
    padding: 60px 28px 80px;
  }
  .home h1 {
    font-family: "Noto Serif SC", "Fraunces", serif;
    font-weight: 700; font-size: 52px; line-height: 1.1;
    margin: 0 0 16px; letter-spacing: -0.02em;
  }
  .home h1 em {
    font-style: normal; color: var(--green); background: var(--green-bright);
    padding: 2px 10px; border-radius: 8px;
  }
  .home .lede {
    font-size: 18px; color: var(--ink-soft); line-height: 1.6;
    max-width: 640px; margin: 0 0 20px;
  }
  .home .meta {
    display: inline-flex; gap: 10px; margin-bottom: 36px;
    font-family: "JetBrains Mono", monospace; font-size: 11px;
    color: var(--ink-soft);
  }
  .home .meta span {
    padding: 5px 10px; background: var(--bg-panel);
    border: 1px solid var(--line); border-radius: 999px;
  }
  .home h2 {
    font-family: "JetBrains Mono", monospace; font-size: 11px;
    color: var(--ink-soft); letter-spacing: 0.1em; text-transform: uppercase;
    margin: 32px 0 14px;
  }
  .home .toc {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 14px;
  }
  .home .card {
    background: var(--bg-panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 20px 22px;
    cursor: pointer; display: block;
    transition: transform .15s ease, border-color .15s ease;
    color: var(--ink);
    position: relative; overflow: hidden;
  }
  .home .card:hover { transform: translateY(-2px); border-color: #B9CDA7; }
  .home .card .num {
    font-family: "JetBrains Mono", monospace; font-size: 11px;
    color: var(--ink-soft); letter-spacing: 0.08em;
    margin-bottom: 10px;
  }
  .home .card h3 {
    font-family: "Noto Serif SC", "Fraunces", serif; font-weight: 700;
    font-size: 22px; margin: 0 0 8px; line-height: 1.3;
  }
  .home .card p {
    font-size: 13px; color: var(--ink-soft); line-height: 1.55; margin: 0 0 14px;
  }
  .home .card .foot {
    display: flex; justify-content: space-between; align-items: center;
    font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--ink-soft);
  }
  .home .card .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 9px; border-radius: 999px;
    background: var(--green-soft); color: var(--green);
    border: 1px solid #B9CDA7; font-size: 10px; font-weight: 500;
  }
  .home .card.c1 { background: linear-gradient(140deg, #FAF7EC 60%, #E4ECD6); }
  .home .card.c2 { background: linear-gradient(140deg, #FAF7EC 60%, #FBF1C0); }
  .home .card.c3 { background: linear-gradient(140deg, #FAF7EC 60%, #F9E3DC); }
  .home .card.c4 { background: linear-gradient(140deg, #FAF7EC 60%, #E3EBF0); }
  .home .card.c5 { background: linear-gradient(140deg, #FAF7EC 60%, #EFE5F3); }

  .home .footer {
    margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--line);
    font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--ink-soft);
    display: flex; gap: 20px; flex-wrap: wrap;
  }

  /* LESSON */
  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    gap: 24px;
    padding: 24px 28px 48px;
    max-width: 1280px;
    margin: 0 auto;
  }
  .stage { min-width: 0; }
  .crumb {
    font-family: "JetBrains Mono", monospace;
    font-size: 12px; color: var(--ink-soft);
    letter-spacing: 0.02em;
    margin-bottom: 8px;
  }
  .crumb a { color: var(--ink-soft); }
  .crumb a:hover { color: var(--green); }
  h1.title {
    font-family: "Noto Serif SC", "Fraunces", serif;
    font-weight: 700; font-size: 36px; line-height: 1.2;
    margin: 0 0 10px; letter-spacing: -0.01em;
  }
  .tags { display: inline-flex; gap: 8px; margin-left: 10px; vertical-align: middle; }
  .tag {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px;
    background: var(--bg-panel); border: 1px solid var(--line);
    font-family: "JetBrains Mono", monospace; font-size: 11px;
    color: var(--ink); font-weight: 500;
  }
  .tag.yellow { background: var(--yellow); border-color: #DCC673; color: #7B6314; }
  .tag.green { background: var(--green-soft); border-color: #B9CDA7; color: var(--green); }
  .tag.blue { background: var(--blue); border-color: #A0B2BE; color: #3C5565; }
  .subtitle { color: var(--ink-soft); font-size: 15px; margin: 0 0 18px; max-width: 640px; }

  .stat-row {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    margin: 14px 0 14px;
  }
  .stat {
    background: var(--bg-panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px;
  }
  .stat .k {
    font-family: "JetBrains Mono", monospace; font-size: 10px;
    color: var(--ink-soft); letter-spacing: 0.08em; text-transform: uppercase;
    display: flex; align-items: center; gap: 6px;
  }
  .stat .v {
    font-family: "JetBrains Mono", monospace; font-size: 14.5px;
    color: var(--ink); margin-top: 6px; min-height: 18px; font-weight: 500;
    transition: color .3s ease;
  }
  .canvas {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    aspect-ratio: 800 / 600;
    position: relative;
    background-image: radial-gradient(circle at 1px 1px, var(--grid) 1px, transparent 0);
    background-size: 16px 16px;
    overflow: hidden;
  }
  .canvas svg { width: 100%; height: 100%; display: block; }
  .ctrls {
    position: absolute; right: 12px; bottom: 12px;
    display: flex; gap: 6px;
  }
  .ctrls button {
    width: 34px; height: 34px; border-radius: 8px;
    background: var(--bg); border: 1px solid var(--line); color: var(--ink);
    font-family: "JetBrains Mono", monospace; font-size: 14px;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .15s ease;
  }
  .ctrls button:hover { background: var(--green-soft); }
  .timeline {
    margin-top: 18px;
    background: var(--bg-panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px 18px;
  }
  .tl-head {
    display: flex; justify-content: space-between;
    font-family: "JetBrains Mono", monospace; font-size: 11px;
    color: var(--ink-soft); letter-spacing: 0.08em; text-transform: uppercase;
    margin-bottom: 14px;
  }
  .tl-steps {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 4px; align-items: start;
    position: relative;
  }
  .tl-steps::before {
    content: ""; position: absolute; left: 14px; right: 14px; top: 14px;
    height: 1px; background: var(--line); z-index: 0;
  }
  .tl-step {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    position: relative;
  }
  .tl-dot {
    width: 30px; height: 30px; border-radius: 999px;
    border: 1.5px solid var(--line); background: var(--bg-panel);
    display: inline-flex; align-items: center; justify-content: center;
    font-family: "JetBrains Mono", monospace; font-size: 13px;
    color: var(--ink-soft); font-weight: 500;
    position: relative; z-index: 1;
    transition: all .2s ease;
  }
  .tl-step.done .tl-dot { border-color: var(--green); color: var(--green); background: var(--green-soft); }
  .tl-step.active .tl-dot {
    border-color: var(--green); background: var(--green); color: #FAF7EC;
    box-shadow: 0 0 0 4px var(--green-soft);
  }
  .tl-label {
    font-size: 11px; color: var(--ink-soft);
    font-family: "JetBrains Mono", monospace;
    text-align: center; min-height: 14px;
  }
  .tl-step.active .tl-label { color: var(--ink); }

  aside.panel {
    background: var(--bg-panel); border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px 22px 18px;
    align-self: start;
    position: sticky; top: 72px;
  }
  .panel-head {
    display: flex; justify-content: space-between; align-items: center;
    font-family: "JetBrains Mono", monospace; font-size: 11px;
    color: var(--ink-soft); letter-spacing: 0.08em; text-transform: uppercase;
    margin-bottom: 12px;
  }
  .panel-head .pill {
    display: inline-block; padding: 4px 10px; border-radius: 999px;
    background: var(--pink); color: #8B4B3F; border: 1px solid #DBB1A6;
    font-size: 10px; font-weight: 500;
  }
  .panel-head .pill.tech { background: var(--yellow); color: #7B6314; border-color: #DCC673; }
  .panel-head .pill.idea { background: var(--green-soft); color: var(--green); border-color: #B9CDA7; }
  h2.step-title {
    font-family: "Noto Serif SC", "Fraunces", serif;
    font-weight: 700; font-size: 20px; margin: 0 0 12px; line-height: 1.35;
  }
  .panel p { font-size: 14px; line-height: 1.6; color: var(--ink); margin: 0 0 12px; }
  .panel code {
    font-family: "JetBrains Mono", monospace; font-size: 12.5px;
    background: var(--bg); padding: 1px 6px; border-radius: 4px;
    border: 1px solid var(--line); color: var(--green);
  }
  .panel strong { color: var(--ink); font-weight: 700; }
  .callout {
    background: var(--green-soft); border: 1px solid #B9CDA7;
    border-radius: 10px; padding: 12px 14px; margin: 14px 0;
  }
  .callout .label {
    font-family: "JetBrains Mono", monospace; font-size: 10px;
    color: var(--green); letter-spacing: 0.1em;
    margin-bottom: 6px; display: flex; align-items: center; gap: 8px;
    font-weight: 600;
  }
  .callout .label .ic {
    display: inline-flex; width: 20px; height: 20px; border-radius: 5px;
    background: var(--bg-panel); align-items: center; justify-content: center;
    font-size: 12px;
  }
  .callout.yellow { background: var(--yellow-soft); border-color: #DCC673; }
  .callout.yellow .label { color: #7B6314; }
  .callout.pink { background: var(--pink-soft); border-color: #DBB1A6; }
  .callout.pink .label { color: #8B4B3F; }
  .callout p { font-size: 13.5px; margin: 0; line-height: 1.55; }

  .nav {
    display: grid; grid-template-columns: auto 1fr; gap: 8px;
    margin: 16px 0 12px;
  }
  .nav button {
    padding: 11px 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg);
    font-family: "Noto Serif SC", serif; font-size: 14px;
    color: var(--ink); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: background .15s ease, opacity .2s ease;
  }
  .nav button.next {
    background: var(--green); color: #FAF7EC; border-color: var(--green);
    font-weight: 600; justify-content: space-between;
  }
  .nav button:hover:not([disabled]) { opacity: .88; }
  .nav button[disabled] { opacity: .35; cursor: default; }
  .hints {
    font-family: "JetBrains Mono", monospace; font-size: 10.5px; color: var(--ink-soft);
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding-top: 2px;
  }
  .kbd {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 20px; height: 20px; padding: 0 6px;
    border: 1px solid var(--line); border-radius: 4px; background: var(--bg);
    font-family: "JetBrains Mono", monospace; font-size: 10.5px; color: var(--ink);
  }
  .learn {
    margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line);
  }
  .learn h3 {
    font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: 0.1em;
    color: var(--ink-soft); margin: 0 0 10px; text-transform: uppercase;
  }
  .learn ul { list-style: none; padding: 0; margin: 0; }
  .learn li {
    display: flex; gap: 10px; align-items: flex-start;
    font-size: 13px; padding: 5px 0;
    transition: color .3s ease;
  }
  .learn li .box {
    width: 14px; height: 14px; border: 1.5px solid var(--line); border-radius: 3px;
    flex: 0 0 14px; margin-top: 3px;
    display: inline-flex; align-items: center; justify-content: center;
    color: transparent; font-size: 10px; font-weight: 700;
    transition: all .3s ease;
  }
  .learn li.done .box {
    background: var(--green); border-color: var(--green); color: #FAF7EC;
  }
  .learn li.done .box::after { content: "✓"; }

  /* End-of-lesson next-lesson card */
  .next-lesson {
    margin-top: 24px;
    padding: 20px 22px;
    background: var(--green-soft); border: 1px solid #B9CDA7;
    border-radius: 14px;
    display: none;
  }
  .next-lesson.show { display: block; }
  .next-lesson .k {
    font-family: "JetBrains Mono", monospace; font-size: 10px;
    color: var(--green); letter-spacing: 0.1em; text-transform: uppercase;
    margin-bottom: 6px;
  }
  .next-lesson h3 {
    font-family: "Noto Serif SC", "Fraunces", serif;
    font-size: 20px; margin: 0 0 8px; line-height: 1.3;
  }
  .next-lesson p { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 14px; }
  .next-lesson .go {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-radius: 10px;
    background: var(--green); color: #FAF7EC;
    font-family: "Noto Serif SC", serif; font-weight: 600;
    text-decoration: none; font-size: 14px;
  }

  /* SVG reveals */
  [data-reveal] {
    opacity: 0; transform: translateY(6px);
    transition: opacity .45s ease, transform .45s ease;
  }
  [data-reveal].on { opacity: 1; transform: translateY(0); }

  .arrow {
    fill: none; stroke: var(--green); stroke-width: 1.6;
    stroke-dasharray: 5 5;
  }
  [data-reveal].on .arrow {
    animation: draw 0.9s ease forwards;
  }
  @keyframes draw {
    from { stroke-dashoffset: 400; }
    to { stroke-dashoffset: 0; }
  }

  @media (max-width: 920px) {
    main { grid-template-columns: 1fr; }
    aside.panel { position: static; }
    .stat-row { grid-template-columns: repeat(2, 1fr); }
    h1.title { font-size: 28px; }
    .home h1 { font-size: 36px; }
  }
</style>
</head>
<body>
<header>
  <div class="logo" onclick="go('')">
    <span class="mark">◆</span>
    <span>Agent <em>Atlas</em></span>
  </div>
  <div class="lesson-nav" id="lesson-nav"></div>
</header>

<div id="app"></div>

<script>
  /* ============== LESSONS ============== */

  const lessons = [
    /* ---------- 1: CHAT ---------- */
    {

          <text x="185" y="291" font-family="JetBrains Mono, monospace" font-size="11" fill="#3D5D3C">你好</text>
          <circle cx="285" cy="348" r="2" fill="#B9CDA7"/>
          <circle cx="230" cy="420" r="16" fill="#F2D3CB" stroke="#A89D7E" stroke-width="1.2"/>
          <path d="M 207 452 Q 230 435 253 452 L 258 500 L 202 500 Z" fill="#CDD9E0" stroke="#A89D7E" stroke-width="1.2"/>
          <text x="230" y="522" font-family="JetBrains Mono, monospace" font-size="11" fill="#6B6454" text-anchor="middle">you</text>
        </g>
        <g data-reveal data-show="1,2">
          <path class="arrow" d="M 310 300 Q 460 270 614 240" marker-end="url(#arrow-head)"/>

        },
        {
          pill: "code", pillClass: "tech",
          title: "把补丁打回去, 就是能用的 runner",
          body: `<p>把上面三种翻车的修复加回"原始 10 行", 你就有了一个能上生产的小 runner: 大约 20 行。</p>
            <p>多的: ① <code>for i in range(max_iter)</code> 封顶 · ② <code>with_retry</code> 包工具调用 · ③ <code>compress_if_full</code> 压缩旧消息。</p>
            <div class="callout"><div class="label"><span class="ic">✓</span>五节连起来</div>
            <p><strong>Chat</strong>(消息列表) → <strong>Prompt</strong>(system 塑形) → <strong>Skill</strong>(prompt 打包) → <strong>Agent</strong>(加工具 + 循环) → <strong>Runtime</strong>(把循环写稳)。这就是 AI Agent 的全貌。</p></div>`,
          next: "看完了 ✓",
          stats: ["≤ max_iter", "全", "受控", "可运维"],
        },
      ],
    },
  ];

  /* ============== ROUTER + RENDER ============== */

  const app = document.getElementById("app");
  const nav = document.getElementById("lesson-nav");

  function parseRoute() {
    const h = location.hash.replace(/^#\/?/, "");
    if (!h) return { page: "home" };
    const slug = h.split("/")[0];
    const lesson = lessons.find(l => l.slug === slug);
    if (!lesson) return { page: "home" };
    const stepStr = h.split("/")[1];
    const step = Math.max(1, Math.min(lesson.stepCount, parseInt(stepStr, 10) || 1));
    return { page: "lesson", lesson, step };
  }

  function go(hash) { location.hash = hash ? ("#/" + hash) : ""; }
  window.go = go;

  function renderNav(route) {
    nav.innerHTML = "";
    if (route.page === "home") { nav.innerHTML = `<span class="n-cur">课程首页</span>`; return; }
    const i = lessons.indexOf(route.lesson);
    const prev = lessons[i - 1];
    const next = lessons[i + 1];
    nav.innerHTML = `
      <button class="n-btn" ${prev ? "" : "disabled"} onclick="${prev ? `go('${prev.slug}')` : ""}">← ${prev ? prev.slug : "—"}</button>
      <span class="n-cur">${route.lesson.num}. ${route.lesson.slug}</span>
      <button class="n-btn" ${next ? "" : "disabled"} onclick="${next ? `go('${next.slug}')` : ""}">${next ? next.slug : "—"} →</button>
      <button class="n-btn" onclick="go('')">◆ TOC</button>
    `;
  }

  function renderHome() {
    const cards = lessons.map((l, i) => `
      <a class="card c${i+1}" href="#/${l.slug}">
        <div class="num">0${l.num} · ${l.level}</div>
        <h3>${l.title}</h3>
        <p>${l.short}</p>
        <div class="foot">
          <span>${l.duration} · ${l.stepCount} 步</span>
          <span class="pill">开始 →</span>
        </div>
      </a>
    `).join("");

    app.innerHTML = `
      <div class="home">
        <h1>一本关于 <em>AI Agent</em> 的小书</h1>
        <p class="lede">用插画和 4 步拆解, 把 chat、prompt、skill、agent、以及 agent 怎么运行的 —— 从头到尾讲一遍。</p>
        <div class="meta">
          <span>◇ 5 节 · 约 30 分钟</span>
          <span>◇ 入门 → 进阶</span>
          <span>◇ 从非程序员到开发者, 都能看</span>
        </div>

        <h2>目录</h2>
        <div class="toc">${cards}</div>

        <div class="footer">
          <span>↑/↓ 浏览 · Enter 进入 · 每节内按 ←/→/Space 步进</span>
          <span>· 配色与版式致敬 <a href="https://designed-to-scale.vercel.app/" target="_blank">designed-to-scale</a></span>
        </div>
      </div>
    `;
  }

  let cur = 0;
  let lesson = null;

  function renderLesson(route) {
    lesson = route.lesson;
    cur = route.step - 1;
    const i = lessons.indexOf(lesson);
    const nextLesson = lessons[i + 1];

    app.innerHTML = `
      <main>
        <section class="stage">
          <div class="crumb"><a href="#/">◆ Agent Atlas</a>  /  0${lesson.num} · ${lesson.level} / 第 ${lesson.num} 节, 共 ${lessons.length} 节</div>
          <h1 class="title">${lesson.title}<span class="tags"><span class="tag yellow">⏱ ${lesson.duration}</span><span class="tag green">◈ ${lesson.level}</span><span class="tag blue">⋮ ${lesson.stepCount} 步</span></span></h1>
          <p class="subtitle">${lesson.subtitle}</p>
          <div class="stat-row">
            ${lesson.stats.map((k, j) => `<div class="stat"><div class="k">${k}</div><div class="v" id="s-${j}">—</div></div>`).join("")}
          </div>
          <div class="canvas">
            <svg id="scene" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet">${lesson.svg}</svg>
            <div class="ctrls">
              <button id="replay" title="回放 (R)">↻</button>
              <button id="pause" title="下一步 (Space)">▶</button>
            </div>
          </div>
          <div class="timeline">
            <div class="tl-head"><span>本节步骤</span><span>第 <span id="tl-cur">1</span> / ${lesson.stepCount} 步</span></div>
            <div class="tl-steps" id="tl-steps">
              ${lesson.tlLabels.map((label, j) => `<div class="tl-step"><div class="tl-dot">${j+1}</div><div class="tl-label">${label}</div></div>`).join("")}
            </div>
          </div>
          <div class="next-lesson" id="next-lesson">
            <div class="k">下一节</div>
            <h3>${nextLesson ? `${nextLesson.num}. ${nextLesson.title}` : "全部看完了 ✓"}</h3>
            <p>${nextLesson ? nextLesson.short : "你已经把 chat、prompt、skill、agent、runtime 都过完了。要不要回首页再翻一节?"}</p>
            ${nextLesson
              ? `<a class="go" href="#/${nextLesson.slug}">进入下一节 →</a>`
              : `<a class="go" href="#/">回首页</a>`}
          </div>
        </section>
        <aside class="panel">
          <div class="panel-head"><span>步骤 <span id="p-num">1</span> / ${lesson.stepCount}</span><span class="pill" id="p-pill">场景</span></div>
          <h2 class="step-title" id="p-title"></h2>
          <div id="p-body"></div>
          <div class="nav">
            <button class="back" id="btn-back">← 上一步</button>
            <button class="next" id="btn-next">下一步 →</button>
          </div>
          <div class="hints">
            <span><span class="kbd">←</span> <span class="kbd">→</span> 步进</span>
            <span>·</span>
            <span><span class="kbd">R</span> 回放</span>
            <span>·</span>
            <span><span class="kbd">Space</span> 下一步</span>
          </div>
          <div class="learn">
            <h3>本节你将搞懂</h3>
            <ul id="learn-list">
              ${lesson.learn.map(t => `<li><span class="box"></span>${t}</li>`).join("")}
            </ul>
          </div>
        </aside>
      </main>
    `;

    document.getElementById("btn-next").addEventListener("click", nextStep);
    document.getElementById("btn-back").addEventListener("click", prevStep);
    document.getElementById("replay").addEventListener("click", replay);
    document.getElementById("pause").addEventListener("click", nextStep);

    renderStep();
  }

  function renderStep() {
    const step = lesson.steps[cur];
    const scene = document.getElementById("scene");

    document.getElementById("p-num").textContent = cur + 1;
    const pill = document.getElementById("p-pill");
    pill.textContent = step.pill;
    pill.className = "pill " + (step.pillClass || "");
    document.getElementById("p-title").textContent = step.title;
    document.getElementById("p-body").innerHTML = step.body;

    const btnNext = document.getElementById("btn-next");
    const btnBack = document.getElementById("btn-back");
    btnNext.textContent = step.next;
    btnBack.disabled = cur === 0;

    const i = lessons.indexOf(lesson);
    const nextLesson = lessons[i + 1];
    const nextBox = document.getElementById("next-lesson");

    if (cur === lesson.stepCount - 1) {
      btnNext.disabled = !nextLesson;
      if (nextLesson) {
        btnNext.onclick = () => go(nextLesson.slug);
        btnNext.textContent = `进入 ${nextLesson.num}. ${nextLesson.slug} →`;
      } else {
        btnNext.onclick = () => go("");
        btnNext.textContent = "回首页 ◆";
        btnNext.disabled = false;
      }
      nextBox.classList.add("show");
    } else {
      btnNext.onclick = nextStep;
      nextBox.classList.remove("show");
    }

    document.getElementById("tl-cur").textContent = cur + 1;
    document.querySelectorAll(".tl-step").forEach((el, j) => {
      el.classList.toggle("done", j < cur);
      el.classList.toggle("active", j === cur);
    });
    document.querySelectorAll("#learn-list li").forEach((el, j) => {
      el.classList.toggle("done", j <= cur);
    });
    step.stats.forEach((v, j) => {
      const el = document.getElementById("s-" + j);
      if (el) el.textContent = v;
    });

    const stepNum = cur + 1;
    scene.querySelectorAll("[data-show]").forEach(el => {
      const shows = el.getAttribute("data-show").split(",").map(s => +s.trim());
      el.classList.toggle("on", shows.includes(stepNum));
    });

    // retrigger arrow draw
    scene.querySelectorAll(".arrow").forEach(a => a.style.animation = "none");
    requestAnimationFrame(() => {
      scene.querySelectorAll(".arrow").forEach(a => a.style.animation = "");
    });

    history.replaceState(null, "", "#/" + lesson.slug + "/" + (cur + 1));
  }

  function nextStep() { if (cur < lesson.stepCount - 1) { cur++; renderStep(); } }
  function prevStep() { if (cur > 0) { cur--; renderStep(); } }
  function replay() { renderStep(); }

  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
    if (!lesson) return;
    if (e.key === "ArrowRight" || e.code === "Space") { e.preventDefault(); nextStep(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); prevStep(); }
    else if (e.key.toLowerCase() === "r") { replay(); }
  });

  function route() {
    const r = parseRoute();
    renderNav(r);
    if (r.page === "home") { lesson = null; renderHome(); }
    else { renderLesson(r); }
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
</script>
</body>
</html>
