<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Atlas · 一本关于 AI Agent 的小书</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F0ECE0;
    --bg-panel: #FAF7EC;
    --ink: #2C2820;
    --ink-soft: #6B6454;
    --green: #3D5D3C;
    --green-bright: #D5EC9B;
    --green-soft: #E4ECD6;
    --line: #DDD6C2;
    --grid: #E5DFC8;
    --yellow: #F5E9A8;
    --yellow-soft: #FBF1C0;
    --pink: #F2D3CB;
    --pink-soft: #F9E3DC;
    --blue: #CDD9E0;
    --blue-soft: #E3EBF0;
    --purple: #D6CDE0;
    --code-bg: #262319;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Serif SC", "Fraunces", "Noto Sans SC", serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    background-image:
      linear-gradient(to right, var(--grid) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    background-position: -1px -1px;
    min-height: 100vh;
  }
  a { color: var(--green); text-decoration: none; }
  a:hover { opacity: .8; }

  /* Header */
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 28px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    position: sticky; top: 0; z-index: 10;
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    font-family: "Fraunces", "Noto Serif SC", serif;
    font-weight: 600; font-size: 20px;
    color: var(--ink); cursor: pointer;
  }
  .logo .mark {
    width: 30px; height: 30px; border-radius: 7px;
    background: var(--green-soft); border: 1px solid #B9CDA7;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: "JetBrains Mono", monospace; font-weight: 600; color: var(--green);
  }
  .logo em {
    font-style: normal; color: var(--green); background: var(--green-bright);
    padding: 0 6px; border-radius: 4px;
  }
  .lesson-nav {
    margin-left: auto;
    display: flex; align-items: center; gap: 8px;
    font-family: "JetBrains Mono", monospace; font-size: 11px;
    color: var(--ink-soft);
  }
  .lesson-nav .n-btn {
    padding: 6px 10px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg-panel);
    color: var(--ink); cursor: pointer;
    font-family: inherit; font-size: 11px;
  }
  .lesson-nav .n-btn:hover { background: var(--green-soft); }
  .lesson-nav .n-btn[disabled] { opacity: .35; cursor: default; }
  .lesson-nav .n-cur {
    padding: 4px 10px; border-radius: 999px;
    background: var(--green-soft); color: var(--green);
    border: 1px solid #B9CDA7;
  }

  /* HOME */
  .home {
    max-width: 960px; margin: 0 auto;
    padding: 60px 28px 80px;
  }
  .home h1 {
    font-family: "Noto Serif SC", "Fraunces", serif;
    font-weight: 700; font-size: 52px; line-height: 1.1;
    margin: 0 0 16px; letter-spacing: -0.02em;
  }
  .home h1 em {
    font-style: normal; color: var(--green); background: var(--green-bright);
    padding: 2px 10px; border-radius: 8px;
  }
  .home .lede {
    font-size: 18px; color: var(--ink-soft); line-height: 1.6;
    max-width: 640px; margin: 0 0 20px;
  }
  .home .meta {
    display: inline-flex; gap: 10px; margin-bottom: 36px;
    font-family: "JetBrains Mono", monospace; font-size: 11px;
    color: var(--ink-soft);
  }
  .home .meta span {
    padding: 5px 10px; background: var(--bg-panel);
    border: 1px solid var(--line); border-radius: 999px;
  }
  .home h2 {
    font-family: "JetBrains Mono", monospace; font-size: 11px;
    color: var(--ink-soft); letter-spacing: 0.1em; text-transform: uppercase;
    margin: 32px 0 14px;
  }
  .home .toc {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 14px;
  }
  .home .card {
    background: var(--bg-panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 20px 22px;
    cursor: pointer; display: block;
    transition: transform .15s ease, border-color .15s ease;
    color: var(--ink);
    position: relative; overflow: hidden;
  }
  .home .card:hover { transform: translateY(-2px); border-color: #B9CDA7; }
  .home .card .num {
    font-family: "JetBrains Mono", monospace; font-size: 11px;
    color: var(--ink-soft); letter-spacing: 0.08em;
    margin-bottom: 10px;
  }
  .home .card h3 {
    font-family: "Noto Serif SC", "Fraunces", serif; font-weight: 700;
    font-size: 22px; margin: 0 0 8px; line-height: 1.3;
  }
  .home .card p {
    font-size: 13px; color: var(--ink-soft); line-height: 1.55; margin: 0 0 14px;
  }
  .home .card .foot {
    display: flex; justify-content: space-between; align-items: center;
    font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--ink-soft);
  }
  .home .card .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 9px; border-radius: 999px;
    background: var(--green-soft); color: var(--green);
    border: 1px solid #B9CDA7; font-size: 10px; font-weight: 500;
  }
  .home .card.c1 { background: linear-gradient(140deg, #FAF7EC 60%, #E4ECD6); }
  .home .card.c2 { background: linear-gradient(140deg, #FAF7EC 60%, #FBF1C0); }
  .home .card.c3 { background: linear-gradient(140deg, #FAF7EC 60%, #F9E3DC); }
  .home .card.c4 { background: linear-gradient(140deg, #FAF7EC 60%, #E3EBF0); }
  .home .card.c5 { background: linear-gradient(140deg, #FAF7EC 60%, #EFE5F3); }

  .home .footer {
    margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--line);
    font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--ink-soft);
    display: flex; gap: 20px; flex-wrap: wrap;
  }

  /* LESSON */
  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    gap: 24px;
    padding: 24px 28px 48px;
    max-width: 1280px;
    margin: 0 auto;
  }
  .stage { min-width: 0; }
  .crumb {
    font-family: "JetBrains Mono", monospace;
    font-size: 12px; color: var(--ink-soft);
    letter-spacing: 0.02em;
    margin-bottom: 8px;
  }
  .crumb a { color: var(--ink-soft); }
  .crumb a:hover { color: var(--green); }
  h1.title {
    font-family: "Noto Serif SC", "Fraunces", serif;
    font-weight: 700; font-size: 36px; line-height: 1.2;
    margin: 0 0 10px; letter-spacing: -0.01em;
  }
  .tags { display: inline-flex; gap: 8px; margin-left: 10px; vertical-align: middle; }
  .tag {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px;
    background: var(--bg-panel); border: 1px solid var(--line);
    font-family: "JetBrains Mono", monospace; font-size: 11px;
    color: var(--ink); font-weight: 500;
  }
  .tag.yellow { background: var(--yellow); border-color: #DCC673; color: #7B6314; }
  .tag.green { background: var(--green-soft); border-color: #B9CDA7; color: var(--green); }
  .tag.blue { background: var(--blue); border-color: #A0B2BE; color: #3C5565; }
  .subtitle { color: var(--ink-soft); font-size: 15px; margin: 0 0 18px; max-width: 640px; }

  .stat-row {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    margin: 14px 0 14px;
  }
  .stat {
    background: var(--bg-panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px;
  }
  .stat .k {
    font-family: "JetBrains Mono", monospace; font-size: 10px;
    color: var(--ink-soft); letter-spacing: 0.08em; text-transform: uppercase;
    display: flex; align-items: center; gap: 6px;
  }
  .stat .v {
    font-family: "JetBrains Mono", monospace; font-size: 14.5px;
    color: var(--ink); margin-top: 6px; min-height: 18px; font-weight: 500;
    transition: color .3s ease;
  }
  .canvas {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    aspect-ratio: 800 / 600;
    position: relative;
    background-image: radial-gradient(circle at 1px 1px, var(--grid) 1px, transparent 0);
    background-size: 16px 16px;
    overflow: hidden;
  }
  .canvas svg { width: 100%; height: 100%; display: block; }
  .ctrls {
    position: absolute; right: 12px; bottom: 12px;
    display: flex; gap: 6px;
  }
  .ctrls button {
    width: 34px; height: 34px; border-radius: 8px;
    background: var(--bg); border: 1px solid var(--line); color: var(--ink);
    font-family: "JetBrains Mono", monospace; font-size: 14px;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .15s ease;
  }
  .ctrls button:hover { background: var(--green-soft); }
  .timeline {
    margin-top: 18px;
    background: var(--bg-panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px 18px;
  }
  .tl-head {
    display: flex; justify-content: space-between;
    font-family: "JetBrains Mono", monospace; font-size: 11px;
    color: var(--ink-soft); letter-spacing: 0.08em; text-transform: uppercase;
    margin-bottom: 14px;
  }
  .tl-steps {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 4px; align-items: start;
    position: relative;
  }
  .tl-steps::before {
    content: ""; position: absolute; left: 14px; right: 14px; top: 14px;
    height: 1px; background: var(--line); z-index: 0;
  }
  .tl-step {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    position: relative;
  }
  .tl-dot {
    width: 30px; height: 30px; border-radius: 999px;
    border: 1.5px solid var(--line); background: var(--bg-panel);
    display: inline-flex; align-items: center; justify-content: center;
    font-family: "JetBrains Mono", monospace; font-size: 13px;
    color: var(--ink-soft); font-weight: 500;
    position: relative; z-index: 1;
    transition: all .2s ease;
  }
  .tl-step.done .tl-dot { border-color: var(--green); color: var(--green); background: var(--green-soft); }
  .tl-step.active .tl-dot {
    border-color: var(--green); background: var(--green); color: #FAF7EC;
    box-shadow: 0 0 0 4px var(--green-soft);
  }
  .tl-label {
    font-size: 11px; color: var(--ink-soft);
    font-family: "JetBrains Mono", monospace;
    text-align: center; min-height: 14px;
  }
  .tl-step.active .tl-label { color: var(--ink); }

  aside.panel {
    background: var(--bg-panel); border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px 22px 18px;
    align-self: start;
    position: sticky; top: 72px;
  }
  .panel-head {
    display: flex; justify-content: space-between; align-items: center;
    font-family: "JetBrains Mono", monospace; font-size: 11px;
    color: var(--ink-soft); letter-spacing: 0.08em; text-transform: uppercase;
    margin-bottom: 12px;
  }
  .panel-head .pill {
    display: inline-block; padding: 4px 10px; border-radius: 999px;
    background: var(--pink); color: #8B4B3F; border: 1px solid #DBB1A6;
    font-size: 10px; font-weight: 500;
  }
  .panel-head .pill.tech { background: var(--yellow); color: #7B6314; border-color: #DCC673; }
  .panel-head .pill.idea { background: var(--green-soft); color: var(--green); border-color: #B9CDA7; }
  h2.step-title {
    font-family: "Noto Serif SC", "Fraunces", serif;
    font-weight: 700; font-size: 20px; margin: 0 0 12px; line-height: 1.35;
  }
  .panel p { font-size: 14px; line-height: 1.6; color: var(--ink); margin: 0 0 12px; }
  .panel code {
    font-family: "JetBrains Mono", monospace; font-size: 12.5px;
    background: var(--bg); padding: 1px 6px; border-radius: 4px;
    border: 1px solid var(--line); color: var(--green);
  }
  .panel strong { color: var(--ink); font-weight: 700; }
  .callout {
    background: var(--green-soft); border: 1px solid #B9CDA7;
    border-radius: 10px; padding: 12px 14px; margin: 14px 0;
  }
  .callout .label {
    font-family: "JetBrains Mono", monospace; font-size: 10px;
    color: var(--green); letter-spacing: 0.1em;
    margin-bottom: 6px; display: flex; align-items: center; gap: 8px;
    font-weight: 600;
  }
  .callout .label .ic {
    display: inline-flex; width: 20px; height: 20px; border-radius: 5px;
    background: var(--bg-panel); align-items: center; justify-content: center;
    font-size: 12px;
  }
  .callout.yellow { background: var(--yellow-soft); border-color: #DCC673; }
  .callout.yellow .label { color: #7B6314; }
  .callout.pink { background: var(--pink-soft); border-color: #DBB1A6; }
  .callout.pink .label { color: #8B4B3F; }
  .callout p { font-size: 13.5px; margin: 0; line-height: 1.55; }

  .nav {
    display: grid; grid-template-columns: auto 1fr; gap: 8px;
    margin: 16px 0 12px;
  }
  .nav button {
    padding: 11px 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg);
    font-family: "Noto Serif SC", serif; font-size: 14px;
    color: var(--ink); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: background .15s ease, opacity .2s ease;
  }
  .nav button.next {
    background: var(--green); color: #FAF7EC; border-color: var(--green);
    font-weight: 600; justify-content: space-between;
  }
  .nav button:hover:not([disabled]) { opacity: .88; }
  .nav button[disabled] { opacity: .35; cursor: default; }
  .hints {
    font-family: "JetBrains Mono", monospace; font-size: 10.5px; color: var(--ink-soft);
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding-top: 2px;
  }
  .kbd {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 20px; height: 20px; padding: 0 6px;
    border: 1px solid var(--line); border-radius: 4px; background: var(--bg);
    font-family: "JetBrains Mono", monospace; font-size: 10.5px; color: var(--ink);
  }
  .learn {
    margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line);
  }
  .learn h3 {
    font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: 0.1em;
    color: var(--ink-soft); margin: 0 0 10px; text-transform: uppercase;
  }
  .learn ul { list-style: none; padding: 0; margin: 0; }
  .learn li {
    display: flex; gap: 10px; align-items: flex-start;
    font-size: 13px; padding: 5px 0;
    transition: color .3s ease;
  }
  .learn li .box {
    width: 14px; height: 14px; border: 1.5px solid var(--line); border-radius: 3px;
    flex: 0 0 14px; margin-top: 3px;
    display: inline-flex; align-items: center; justify-content: center;
    color: transparent; font-size: 10px; font-weight: 700;
    transition: all .3s ease;
  }
  .learn li.done .box {
    background: var(--green); border-color: var(--green); color: #FAF7EC;
  }
  .learn li.done .box::after { content: "✓"; }

  /* End-of-lesson next-lesson card */
  .next-lesson {
    margin-top: 24px;
    padding: 20px 22px;
    background: var(--green-soft); border: 1px solid #B9CDA7;
    border-radius: 14px;
    display: none;
  }
  .next-lesson.show { display: block; }
  .next-lesson .k {
    font-family: "JetBrains Mono", monospace; font-size: 10px;
    color: var(--green); letter-spacing: 0.1em; text-transform: uppercase;
    margin-bottom: 6px;
  }
  .next-lesson h3 {
    font-family: "Noto Serif SC", "Fraunces", serif;
    font-size: 20px; margin: 0 0 8px; line-height: 1.3;
  }
  .next-lesson p { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 14px; }
  .next-lesson .go {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-radius: 10px;
    background: var(--green); color: #FAF7EC;
    font-family: "Noto Serif SC", serif; font-weight: 600;
    text-decoration: none; font-size: 14px;
  }

  /* SVG reveals */
  [data-reveal] {
    opacity: 0; transform: translateY(6px);
    transition: opacity .45s ease, transform .45s ease;
  }
  [data-reveal].on { opacity: 1; transform: translateY(0); }

  .arrow {
    fill: none; stroke: var(--green); stroke-width: 1.6;
    stroke-dasharray: 5 5;
  }
  [data-reveal].on .arrow {
    animation: draw 0.9s ease forwards;
  }
  @keyframes draw {
    from { stroke-dashoffset: 400; }
    to { stroke-dashoffset: 0; }
  }

  /* Top tabs */
  .top-tabs {
    display: flex; gap: 4px; padding: 4px;
    background: var(--bg-panel); border: 1px solid var(--line);
    border-radius: 10px;
  }
  .top-tabs .tab {
    padding: 6px 14px; border-radius: 7px;
    font-family: "Noto Serif SC", serif; font-size: 13px;
    color: var(--ink-soft); font-weight: 500;
    transition: all .15s ease; text-decoration: none;
  }
  .top-tabs .tab:hover { color: var(--ink); background: var(--green-soft); }
  .top-tabs .tab.active { background: var(--green); color: #FAF7EC; }
  .top-tabs .tab.active:hover { background: var(--green); color: #FAF7EC; }

  /* Home: glossary CTA */
  .home .glossary-cta {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 26px; margin: 24px 0 8px;
    border-radius: 14px; border: 1px solid var(--line);
    background: linear-gradient(140deg, #FAF7EC 55%, #F2D3CB);
    text-decoration: none; color: var(--ink);
    transition: transform .15s ease, border-color .15s ease;
  }
  .home .glossary-cta:hover { transform: translateY(-2px); border-color: var(--green); }
  .home .glossary-cta .txt h3 {
    font-family: "Noto Serif SC", "Fraunces", serif;
    font-size: 22px; font-weight: 700; margin: 0 0 6px;
  }
  .home .glossary-cta .txt p { margin: 0; color: var(--ink-soft); font-size: 13px; line-height: 1.5; }
  .home .glossary-cta .btn {
    padding: 10px 18px; border-radius: 10px;
    background: var(--green); color: #FAF7EC;
    font-family: "Noto Serif SC", serif; font-size: 14px; font-weight: 600;
    white-space: nowrap; margin-left: 20px;
  }

  /* Glossary home */
  .glossary-home { max-width: 1080px; margin: 0 auto; padding: 36px 28px 60px; }
  .glossary-home h1 {
    font-family: "Noto Serif SC", "Fraunces", serif;
    font-weight: 700; font-size: 42px; line-height: 1.15;
    margin: 0 0 12px; letter-spacing: -0.01em;
  }
  .glossary-home h1 em {
    font-style: normal; color: var(--green); background: var(--green-bright);
    padding: 2px 10px; border-radius: 8px;
  }
  .glossary-home .lede {
    font-size: 15px; color: var(--ink-soft);
    max-width: 680px; margin: 0 0 28px; line-height: 1.65;
  }
  .subway-map {
    background: var(--bg-panel); border: 1px solid var(--line);
    border-radius: 14px; margin-bottom: 36px;
    aspect-ratio: 4 / 3;
    background-image: radial-gradient(circle at 1px 1px, var(--grid) 1px, transparent 0);
    background-size: 16px 16px;
    overflow: hidden; position: relative;
  }
  .subway-map svg { width: 100%; height: 100%; display: block; }
  .subway-map .tip {
    position: absolute; left: 14px; bottom: 14px;
    font-family: "JetBrains Mono", monospace; font-size: 11px;
    color: var(--ink-soft);
    background: var(--bg); padding: 6px 10px; border-radius: 6px;
    border: 1px solid var(--line);
  }
  .group-section { margin-bottom: 28px; scroll-margin-top: 80px; }
  .group-section .head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .group-section .head .dot {
    width: 16px; height: 16px; border-radius: 5px;
    border: 1.5px solid currentColor;
  }
  .group-section .head h2 {
    font-family: "Noto Serif SC", "Fraunces", serif;
    font-size: 20px; font-weight: 700; margin: 0;
  }
  .group-section .head .count {
    font-family: "JetBrains Mono", monospace; font-size: 11px;
    color: var(--ink-soft); margin-left: auto;
  }
  .term-pill-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .term-pill {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: 10px;
    background: var(--bg-panel); border: 1px solid var(--line);
    font-family: "Noto Serif SC", serif; font-size: 13.5px;
    color: var(--ink); text-decoration: none;
    transition: all .15s ease;
  }
  .term-pill:hover { border-color: var(--green); transform: translateY(-1px); }
  .term-pill .en {
    font-family: "JetBrains Mono", monospace; font-size: 11px;
    color: var(--ink-soft);
  }

  /* Term page */

  function renderGlossaryHome() {
    const cx = 400, cy = 300, hubR = 44, branchLen = 180;
    const mapGroups = groups.map(g => {
      const rad = g.angle * Math.PI / 180;
      return {
        ...g,
        x: cx + branchLen * Math.cos(rad),
        y: cy + branchLen * Math.sin(rad),
        sx: cx + (hubR + 2) * Math.cos(rad),
        sy: cy + (hubR + 2) * Math.sin(rad),
      };
    });

    const mapSvg = `
      <svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet">
        <defs>
          <radialGradient id="hub-grad" cx="0.5" cy="0.45">
            <stop offset="0" stop-color="#F9F0C0"/>
            <stop offset="1" stop-color="#EDDC8A"/>
          </radialGradient>
        </defs>
        ${mapGroups.map(g => `
          <line x1="${g.sx}" y1="${g.sy}" x2="${g.x}" y2="${g.y}" stroke="${g.border}" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
          <a href="#glossary-group-${g.slug}">
            <g transform="translate(${g.x}, ${g.y})" style="cursor:pointer">
              <rect x="-72" y="-26" width="144" height="52" rx="12" fill="${g.bg}" stroke="${g.border}" stroke-width="1.5"/>
              <text y="-4" font-family="Noto Serif SC, serif" font-size="14" font-weight="700" fill="${g.ink}" text-anchor="middle">${g.name}</text>
              <text y="15" font-family="JetBrains Mono, monospace" font-size="10" fill="${g.ink}" text-anchor="middle" opacity="0.8">${terms.filter(t => t.group === g.slug).length} 个词</text>
            </g>
          </a>
        `).join("")}
        <circle cx="${cx}" cy="${cy}" r="${hubR}" fill="url(#hub-grad)" stroke="#A89D7E" stroke-width="2"/>
        <text x="${cx}" y="${cy - 2}" font-family="Fraunces, serif" font-weight="700" font-size="22" fill="#3D5D3C" text-anchor="middle">LLM</text>
        <text x="${cx}" y="${cy + 18}" font-family="JetBrains Mono, monospace" font-size="10" fill="#6B6454" text-anchor="middle">术语总图</text>
      </svg>
    `;

    const groupSections = groups.map(g => {
      const gterms = terms.filter(t => t.group === g.slug);
      return `
        <section class="group-section" id="glossary-group-${g.slug}">
          <div class="head" style="color: ${g.ink}">
            <span class="dot" style="background: ${g.bg}; border-color: ${g.border}"></span>
            <h2>${g.name}</h2>
            <span class="count">${gterms.length} 个词</span>
          </div>
          <div class="term-pill-row">
            ${gterms.map(t => `
              <a class="term-pill" href="#/glossary/${t.slug}">
                <span>${t.cn}</span>
                <span class="en">${t.en}</span>
              </a>
            `).join("")}
          </div>
        </section>
      `;
    }).join("");

    app.innerHTML = `
      <div class="glossary-home">
        <h1><em>术语库</em> · LLM 关键词小书</h1>
        <p class="lede">${terms.length} 个常见词, 按 7 个主题分组, 含 context / loop / reasoning / workflow-vs-agent 等热词。每条都是: 一句话定义 + 一个比喻 + 一段代码/图例 + 相关词。地图是全景入口, 点词进单页。</p>
        <div class="subway-map">
          ${mapSvg}
          <div class="tip">点一个主题 → 跳到下面对应分组</div>
        </div>
        ${groupSections}
      </div>
    `;
  }

  function escapeHtml(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function renderTermPage(term) {
    const group = groups.find(g => g.slug === term.group);
    const relatedTerms = (term.related || []).map(slug => terms.find(t => t.slug === slug)).filter(Boolean);
    const deepLesson = term.deepLink ? lessons.find(l => l.slug === term.deepLink) : null;

    app.innerHTML = `
      <div class="term-page">
        <a class="back" href="#/glossary">← 术语库</a>
        <div><span class="group-tag" style="background: ${group.bg}; color: ${group.ink}; border: 1px solid ${group.border}">◆ ${group.name}</span></div>

    { q: "下列哪种评估方式最能反映 agent 在真实业务里好不好用?",
      options: [
        "让它跑 MMLU, 看分数多少",
        "跑几个主流 benchmark, 分数高就行",
        "从真实业务抽 100 条, 用 LLM-as-judge + 人工抽检, 看任务完成率和质量",
        "让 agent 自己给自己打分",
      ], correct: 2,
      explain: "Benchmark 和实际业务常脱节; 业务 eval 要真实样本 + 混合评估(自动 + 人工)。",
      from: { kind: "term", slug: "eval" } },

    // --- v2 新词配套 (深度) ---
    { q: "你的 agent 在长对话里越来越犯迷糊, 最近几轮答非所问。下面哪一步最有可能直接缓解?",
      options: [
        "换成一个 context window 更大的模型",
        "把旧对话压缩成摘要, 只把最近 N 轮和摘要一起发给模型 (context 压缩策略)",
        "把 temperature 调高, 让模型更灵活",
        "让用户每次都重新表述问题",
      ], correct: 1,
      explain: "这是 context engineering 的常见手艺; 不是靠扩窗口蛮力。",
      from: { kind: "term", slug: "context-engineering" } },

    { q: "下列哪种 agent 场景中, prompt caching 收益最大?",
      options: [
        "每轮 user prompt 都完全不同, 而且 system prompt 很短",
        "有 2000 字 system prompt + 大量 tool schema, agent 要跑 50-100 轮",
        "只调用模型一次, 一问一答结束",
        "流式输出任务, 不涉及重复调用",
      ], correct: 1,
      explain: "缓存的是固定前缀; 前缀越大、复用次数越多, 收益越大。",
      from: { kind: "term", slug: "prompt-caching" } },

    { q: "一个代码审查 agent 总是漏边角 case。切换到 reasoning model (如 o1) 的预期最合理的是?",
      options: [
        "质量显著提升, 但延迟和成本会上一个量级",
        "完全消除所有漏洞",
        "响应速度变得更快",
        "不再需要 system prompt",
      ], correct: 0,
      explain: "Reasoning model 用 thinking token 换质量; 典型 trade-off, 不是银弹。",
      from: { kind: "term", slug: "reasoning-model" } },

    { q: "你在设计一个会计报表 agent, 每次任务步骤都明确(取数 → 核对 → 格式化 → 生成)。按模式选, 下面哪种最合适?",
      options: [
        "ReAct: 每步走完再想下一步",
        "Plan-and-Execute: 一次列完计划再按步骤跑",
        "必须用 multi-agent 协作",
        "必须加 reflection, 否则会错",
      ], correct: 1,
      explain: "步骤明确的任务 planning 更稳可预测; ReAct 适合步骤未知的开放场景。",
      from: { kind: "term", slug: "planning" } },

    { q: "你要做一个 \"用户提 bug → 自动归类 → 分给对应 team\" 系统。规则很明确(关键词匹配 + 固定映射表)。按 Anthropic 的建议, 下列哪种实现最合适?",
      options: [
        "做一个 LLM agent, 让它自己决定分给哪个 team",
        "简单 workflow: 关键词匹配 + 固定映射表, 只在模糊归类时让 LLM 兜底",
        "用 multi-agent 多轮讨论归属",
        "必须用 agent, workflow 做不了这种事",
      ], correct: 1,
      explain: "规则明确就写死; agent 是\"不得已才上\"的工具, 不是默认选择。",
      from: { kind: "term", slug: "workflow-vs-agent" } },
  ];

  // Runtime state
  let quizMode = "basic"; // "basic" | "deep"
  const quizSets = { basic: quizBasic, deep: quizDeep };
  const quizPointsPer = { basic: 4, deep: 10 };
  let quizAnswers = { basic: Array(quizBasic.length).fill(null), deep: Array(quizDeep.length).fill(null) };
  let quizSubmitted = { basic: false, deep: false };

  function quizSourceLabel(from) {
    if (from.kind === "lesson") {
      const l = lessons.find(x => x.slug === from.slug);
      return l ? `深入课 · ${l.num}. ${l.slug}` : "深入课";
    }
    if (from.kind === "term") {
      const t = terms.find(x => x.slug === from.slug);
      return t ? `术语 · ${t.en}` : "术语库";
    }
    return "";
  }

  function quizSourceHref(from) {
    if (from.kind === "lesson") return `#/${from.slug}`;
    if (from.kind === "term") return `#/glossary/${from.slug}`;
    return "#/";
  }

  function renderQuiz() {
    const quiz = quizSets[quizMode];
    const points = quizPointsPer[quizMode];
    const answers = quizAnswers[quizMode];
    const submitted = quizSubmitted[quizMode];
    const total = quiz.length;
    const score = quiz.reduce((s, q, i) => s + (answers[i] === q.correct ? points : 0), 0);
    const correctCount = answers.reduce((n, a, i) => n + (a === quiz[i].correct ? 1 : 0), 0);
    const answered = answers.filter(a => a !== null).length;

    const fullScore = total * points;
    const modeName = quizMode === "basic" ? "基础" : "深度";
    const modeTitle = `<em>${total} 题</em> · ${fullScore} 分 · ${modeName}`;
    const modeLede = quizMode === "basic"
      ? `覆盖 5 节深入课 + 全部 ${terms.length} 个术语(含 context / loop / reasoning 等热词)。单选, 每题 ${points} 分, 没时限。`
      : `场景 / 辨析 / 取舍 / 调试, 比基础考难一个台阶。单选, 每题 ${points} 分, 没时限。`;

    const modeTabs = `
      <div class="quiz-mode-tabs">
        <button class="qmtab ${quizMode === "basic" ? "active" : ""}" data-mode="basic">基础 · ${quizBasic.length} 题</button>
        <button class="qmtab ${quizMode === "deep" ? "active" : ""}" data-mode="deep">深度 · ${quizDeep.length} 题</button>
      </div>
    `;

    const pct = fullScore > 0 ? score / fullScore : 0;
    const scoreBar = submitted ? `
      <div class="quiz-score-bar">
        <div><span class="n">${score}</span> <span class="txt">/ ${fullScore}</span></div>
        <div class="txt">答对 ${correctCount} / ${total} · ${pct >= 0.8 ? (quizMode === "basic" ? "基础很稳" : "深度也拿下了") : pct >= 0.6 ? "过了, 还能再读一遍" : (quizMode === "basic" ? "建议回去再看一遍深入课和术语库" : "场景题要结合实践, 回头看看 lesson 4/5")}</div>
      </div>
    ` : "";

    const items = quiz.map((q, i) => {
      const userChoice = answers[i];
      const isCorrect = submitted && userChoice === q.correct;
      const isWrong = submitted && userChoice !== null && userChoice !== q.correct;
      const cardClass = submitted ? (isCorrect ? "correct" : (isWrong ? "wrong" : "")) : "";

      const optionsHtml = q.options.map((opt, j) => {
        let cls = "q-opt";
        if (submitted) {
          cls += " is-disabled";
          if (j === q.correct) cls += " is-correct";
          else if (userChoice === j) cls += " is-wrong";
        } else if (userChoice === j) {
          cls += " is-selected";
        }
        return `
          <label class="${cls}">
            <input type="radio" name="q${i}" value="${j}" ${userChoice === j ? "checked" : ""} ${submitted ? "disabled" : ""}>
            <span class="opt-letter">${"ABCD"[j]}</span>
            <span class="opt-text">${opt}</span>
          </label>
        `;
      }).join("");

      const explain = submitted ? `
        <div class="q-explain">
          <span class="verdict ${isCorrect ? "v-ok" : "v-no"}">${isCorrect ? "答对" : (userChoice === null ? "未作答" : "答错")}</span>
          <a class="src-link" href="${quizSourceHref(q.from)}">→ ${quizSourceLabel(q.from)}</a>
          <span class="expl">${q.explain}</span>
        </div>
      ` : "";

      return `
        <div class="quiz-q ${cardClass}">
          <div class="q-head">
            <span class="q-num">${i + 1}</span>
            <span class="q-text">${q.q}</span>
            <span class="q-source">${quizSourceLabel(q.from)}</span>
          </div>
          <div class="q-options">${optionsHtml}</div>
          ${explain}
        </div>
      `;
    }).join("");

    const statsHtml = submitted ? `
      <div class="quiz-stats">
        <div class="stat good"><div class="k">答对</div><div class="v">${correctCount}</div></div>
        <div class="stat bad"><div class="k">答错</div><div class="v">${answered - correctCount}</div></div>
        <div class="stat"><div class="k">未答</div><div class="v">${total - answered}</div></div>
      </div>
    ` : "";

    app.innerHTML = `
      <div class="quiz-page">
        <h1>考试 · ${modeTitle}</h1>
        <p class="lede">${modeLede}</p>
        ${modeTabs}
        ${scoreBar}
        ${statsHtml}
        <div class="quiz-list">${items}</div>
        <div class="quiz-actions">
          ${submitted
            ? `<button id="quiz-retry" class="secondary">重做</button>`
            : `<button id="quiz-submit">提交 · 看分数</button>`}
        </div>
      </div>
    `;

    // mode tab handlers
    document.querySelectorAll(".qmtab").forEach(btn => {
      btn.addEventListener("click", () => {
        const newMode = btn.getAttribute("data-mode");
        if (newMode !== quizMode) {
          quizMode = newMode;
          renderQuiz();
          window.scrollTo(0, 0);
        }
      });
    });

    // answer handlers
    document.querySelectorAll(".q-opt input").forEach(input => {
      input.addEventListener("change", (e) => {
        const idx = parseInt(e.target.name.substring(1), 10);
        quizAnswers[quizMode][idx] = parseInt(e.target.value, 10);
      });
    });

    if (!submitted) {
      document.getElementById("quiz-submit")?.addEventListener("click", () => {
        quizSubmitted[quizMode] = true;
        renderQuiz();
        window.scrollTo(0, 0);
      });
    } else {
      document.getElementById("quiz-retry")?.addEventListener("click", () => {
        quizAnswers[quizMode] = Array(quizSets[quizMode].length).fill(null);
        quizSubmitted[quizMode] = false;
        renderQuiz();
        window.scrollTo(0, 0);
      });
    }
  }

  /* ============== ROUTER + RENDER ============== */

  const app = document.getElementById("app");
  const nav = document.getElementById("lesson-nav");

  function parseRoute() {
    const h = location.hash.replace(/^#\/?/, "");
    if (!h) return { page: "home" };
    const parts = h.split("/");
    if (parts[0] === "quiz") return { page: "quiz" };
    if (parts[0] === "glossary") {
      if (!parts[1]) return { page: "glossary-home" };
      const term = terms.find(t => t.slug === parts[1]);
      if (!term) return { page: "glossary-home" };
      return { page: "term", term };
    }
    const slug = parts[0];
    const lesson = lessons.find(l => l.slug === slug);
    if (!lesson) return { page: "home" };
    const step = Math.max(1, Math.min(lesson.stepCount, parseInt(parts[1], 10) || 1));
    return { page: "lesson", lesson, step };
  }

  function go(hash) { location.hash = hash ? ("#/" + hash) : ""; }
  window.go = go;

  function renderNav(route) {
    // top-tab active state
    document.querySelectorAll("#top-tabs .tab").forEach(t => t.classList.remove("active"));
    let activeTab = "courses";
    if (route.page === "glossary-home" || route.page === "term") activeTab = "glossary";
    else if (route.page === "quiz") activeTab = "quiz";
    document.querySelector(`#top-tabs [data-tab="${activeTab}"]`)?.classList.add("active");

    nav.innerHTML = "";
    if (route.page === "home") { nav.innerHTML = `<span class="n-cur">课程首页</span>`; return; }
    if (route.page === "glossary-home") { nav.innerHTML = `<span class="n-cur">术语库</span>`; return; }
    if (route.page === "quiz") { nav.innerHTML = `<span class="n-cur">考试</span>`; return; }
    if (route.page === "term") {
      nav.innerHTML = `
        <button class="n-btn" onclick="go('glossary')">← 术语库</button>
        <span class="n-cur">${route.term.en}</span>
      `;
      return;
    }
    const i = lessons.indexOf(route.lesson);
    const prev = lessons[i - 1];
    const next = lessons[i + 1];
    nav.innerHTML = `
      <button class="n-btn" ${prev ? "" : "disabled"} onclick="${prev ? `go('${prev.slug}')` : ""}">← ${prev ? prev.slug : "—"}</button>
      <span class="n-cur">${route.lesson.num}. ${route.lesson.slug}</span>
      <button class="n-btn" ${next ? "" : "disabled"} onclick="${next ? `go('${next.slug}')` : ""}">${next ? next.slug : "—"} →</button>
      <button class="n-btn" onclick="go('')">◆ TOC</button>
    `;
  }

  function renderHome() {
    const cards = lessons.map((l, i) => `
      <a class="card c${i+1}" href="#/${l.slug}">
        <div class="num">0${l.num} · ${l.level}</div>
        <h3>${l.title}</h3>
        <p>${l.short}</p>
        <div class="foot">
          <span>${l.duration} · ${l.stepCount} 步</span>
          <span class="pill">开始 →</span>
        </div>
      </a>
    `).join("");

    app.innerHTML = `
      <div class="home">
        <h1>一本关于 <em>AI Agent</em> 的小书</h1>
        <p class="lede">用插画和 4 步拆解, 把 chat、prompt、skill、agent、以及 agent 怎么运行的 —— 从头到尾讲一遍。</p>
        <div class="meta">
          <span>◇ 5 节 · 约 30 分钟</span>
          <span>◇ 入门 → 进阶</span>
          <span>◇ 从非程序员到开发者, 都能看</span>
        </div>

        <a class="glossary-cta" href="#/glossary">
          <div class="txt">
            <h3>术语库 →</h3>
            <p>35+ 个 LLM 关键词, 按 7 个主题分组, 覆盖 context、loop、reasoning、workflow-vs-agent 等热词。每条都是一句话 + 比喻 + 代码。想随手查就从这里进。</p>
          </div>
          <span class="btn">去查词 →</span>
        </a>

        <h2>深入课</h2>
        <div class="toc">${cards}</div>

        <div class="footer">
          <span>↑/↓ 浏览 · Enter 进入 · 每节内按 ←/→/Space 步进</span>
          <span>· 配色与版式致敬 <a href="https://designed-to-scale.vercel.app/" target="_blank">designed-to-scale</a></span>
        </div>
      </div>
    `;
  }

  let cur = 0;
  let lesson = null;

  function renderLesson(route) {
    lesson = route.lesson;
    cur = route.step - 1;
    const i = lessons.indexOf(lesson);
    const nextLesson = lessons[i + 1];

    app.innerHTML = `
      <main>
        <section class="stage">
          <div class="crumb"><a href="#/">◆ Agent Atlas</a>  /  0${lesson.num} · ${lesson.level} / 第 ${lesson.num} 节, 共 ${lessons.length} 节</div>
          <h1 class="title">${lesson.title}<span class="tags"><span class="tag yellow">⏱ ${lesson.duration}</span><span class="tag green">◈ ${lesson.level}</span><span class="tag blue">⋮ ${lesson.stepCount} 步</span></span></h1>
          <p class="subtitle">${lesson.subtitle}</p>
          <div class="stat-row">
            ${lesson.stats.map((k, j) => `<div class="stat"><div class="k">${k}</div><div class="v" id="s-${j}">—</div></div>`).join("")}
          </div>
          <div class="canvas">
            <svg id="scene" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet">${lesson.svg}</svg>
            <div class="ctrls">
              <button id="replay" title="回放 (R)">↻</button>
              <button id="pause" title="下一步 (Space)">▶</button>
            </div>
          </div>
          <div class="timeline">
            <div class="tl-head"><span>本节步骤</span><span>第 <span id="tl-cur">1</span> / ${lesson.stepCount} 步</span></div>
            <div class="tl-steps" id="tl-steps">
              ${lesson.tlLabels.map((label, j) => `<div class="tl-step"><div class="tl-dot">${j+1}</div><div class="tl-label">${label}</div></div>`).join("")}
            </div>
          </div>
          <div class="next-lesson" id="next-lesson">
            <div class="k">下一节</div>
            <h3>${nextLesson ? `${nextLesson.num}. ${nextLesson.title}` : "全部看完了 ✓"}</h3>
            <p>${nextLesson ? nextLesson.short : "你已经把 chat、prompt、skill、agent、runtime 都过完了。要不要回首页再翻一节?"}</p>
            ${nextLesson
              ? `<a class="go" href="#/${nextLesson.slug}">进入下一节 →</a>`
              : `<a class="go" href="#/">回首页</a>`}
          </div>
        </section>
        <aside class="panel">
          <div class="panel-head"><span>步骤 <span id="p-num">1</span> / ${lesson.stepCount}</span><span class="pill" id="p-pill">场景</span></div>
          <h2 class="step-title" id="p-title"></h2>
          <div id="p-body"></div>
          <div class="nav">
            <button class="back" id="btn-back">← 上一步</button>
            <button class="next" id="btn-next">下一步 →</button>
          </div>
          <div class="hints">
            <span><span class="kbd">←</span> <span class="kbd">→</span> 步进</span>
            <span>·</span>
            <span><span class="kbd">R</span> 回放</span>
            <span>·</span>
            <span><span class="kbd">Space</span> 下一步</span>
          </div>
          <div class="learn">
            <h3>本节你将搞懂</h3>
            <ul id="learn-list">
              ${lesson.learn.map(t => `<li><span class="box"></span>${t}</li>`).join("")}
            </ul>
          </div>
        </aside>
      </main>
    `;

    document.getElementById("btn-next").addEventListener("click", nextStep);
    document.getElementById("btn-back").addEventListener("click", prevStep);
    document.getElementById("replay").addEventListener("click", replay);
    document.getElementById("pause").addEventListener("click", nextStep);

    renderStep();
  }

  function renderStep() {
    const step = lesson.steps[cur];
    const scene = document.getElementById("scene");

    document.getElementById("p-num").textContent = cur + 1;
    const pill = document.getElementById("p-pill");
    pill.textContent = step.pill;
    pill.className = "pill " + (step.pillClass || "");
    document.getElementById("p-title").textContent = step.title;
    document.getElementById("p-body").innerHTML = step.body;

    const btnNext = document.getElementById("btn-next");
    const btnBack = document.getElementById("btn-back");
    btnNext.textContent = step.next;
    btnBack.disabled = cur === 0;

    const i = lessons.indexOf(lesson);
    const nextLesson = lessons[i + 1];
    const nextBox = document.getElementById("next-lesson");

    if (cur === lesson.stepCount - 1) {
      btnNext.disabled = !nextLesson;
      if (nextLesson) {
        btnNext.onclick = () => go(nextLesson.slug);
        btnNext.textContent = `进入 ${nextLesson.num}. ${nextLesson.slug} →`;
      } else {
        btnNext.onclick = () => go("");
        btnNext.textContent = "回首页 ◆";
        btnNext.disabled = false;
      }
      nextBox.classList.add("show");
    } else {
      btnNext.onclick = nextStep;
      nextBox.classList.remove("show");
    }

    document.getElementById("tl-cur").textContent = cur + 1;
    document.querySelectorAll(".tl-step").forEach((el, j) => {
      el.classList.toggle("done", j < cur);
      el.classList.toggle("active", j === cur);
    });
    document.querySelectorAll("#learn-list li").forEach((el, j) => {
      el.classList.toggle("done", j <= cur);
    });
    step.stats.forEach((v, j) => {
      const el = document.getElementById("s-" + j);
      if (el) el.textContent = v;
    });

    const stepNum = cur + 1;
    scene.querySelectorAll("[data-show]").forEach(el => {
      const shows = el.getAttribute("data-show").split(",").map(s => +s.trim());
      el.classList.toggle("on", shows.includes(stepNum));
    });

    // retrigger arrow draw
    scene.querySelectorAll(".arrow").forEach(a => a.style.animation = "none");
    requestAnimationFrame(() => {
      scene.querySelectorAll(".arrow").forEach(a => a.style.animation = "");
    });

    history.replaceState(null, "", "#/" + lesson.slug + "/" + (cur + 1));
  }

  function nextStep() { if (cur < lesson.stepCount - 1) { cur++; renderStep(); } }
  function prevStep() { if (cur > 0) { cur--; renderStep(); } }
  function replay() { renderStep(); }

  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
    if (!lesson) return;
    if (e.key === "ArrowRight" || e.code === "Space") { e.preventDefault(); nextStep(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); prevStep(); }
    else if (e.key.toLowerCase() === "r") { replay(); }
  });

  function route() {
    const r = parseRoute();
    renderNav(r);
    if (r.page === "home") { lesson = null; renderHome(); }
    else if (r.page === "glossary-home") { lesson = null; renderGlossaryHome(); }
    else if (r.page === "term") { lesson = null; renderTermPage(r.term); }
    else if (r.page === "quiz") { lesson = null; renderQuiz(); }
    else { renderLesson(r); }
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
</script>
</body>
</html>
